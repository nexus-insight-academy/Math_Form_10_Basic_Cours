<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Математика 10 · Mate 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a school exercise book — graph-paper page, ink-blue text, red margin rule; sidebar of topics + one open topic */
:root {
  --paper: #fbfcf8;
  --grid: #e3ebf3;
  --ink: #1f3a68;
  --text: #22303f;
  --muted: #6a7788;
  --margin: #d1495b;
  --card: #ffffff;
  --line: #d6dee8;
  --soft: #eef3f9;
  --accent: #2f6fdb;
  --ok: #1e8a4c;
  --ok-bg: #e3f5ea;
  --bad: #c8363f;
  --bad-bg: #fbe6e7;
  --warn: #b7791f;
  --warn-bg: #fdf1dc;
  --l1: #1e8a4c;
  --l2: #d9822b;
  --l3: #c8363f;
  --font-display: "Rubik", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "PT Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #18212b; --grid: #1f2a36; --ink: #9cc0ff; --text: #e3e9f0; --muted: #93a1b2; --margin: #ef6f7f;
    --card: #1f2a36; --line: #2f3d4d; --soft: #243242; --accent: #7fb0ff; --ok: #5fd08f; --ok-bg: #173327;
    --bad: #ff7b83; --bad-bg: #3a1d22; --warn: #f0b35a; --warn-bg: #3a2c16; --l1: #5fd08f; --l2: #f0a45a; --l3: #ff7b83;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #18212b; --grid: #1f2a36; --ink: #9cc0ff; --text: #e3e9f0; --muted: #93a1b2; --margin: #ef6f7f;
  --card: #1f2a36; --line: #2f3d4d; --soft: #243242; --accent: #7fb0ff; --ok: #5fd08f; --ok-bg: #173327;
  --bad: #ff7b83; --bad-bg: #3a1d22; --warn: #f0b35a; --warn-bg: #3a2c16; --l1: #5fd08f; --l2: #f0a45a; --l3: #ff7b83;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--text);
  font: 16px/1.5 var(--font-body);
  margin: 0;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); color: var(--ink); text-wrap: balance; margin: 0; line-height: 1.2; }

.app { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; background: var(--paper); border-bottom: 2px solid var(--margin);
}
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand .logo { display: block; height: 44px; width: auto; background: #fff; border-radius: 8px; padding: 4px 8px; }
.brand .titles { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
@media (max-width: 480px) { .brand .logo { height: 36px; } .brand span { display: none; } }
.brand b { font: 700 1.5rem var(--font-display); color: var(--ink); letter-spacing: 0.01em; }
.brand span { color: var(--muted); font-size: 0.95rem; }
.lang { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 6px 14px; font: 700 0.9rem var(--font-display); letter-spacing: 0.06em; color: var(--ink); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.prof button { letter-spacing: 0; text-transform: none; }
.top .lang + .prof { margin-left: auto; }
.home .prof-note { color: var(--muted); }

.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 24px; margin-top: 18px; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { display: none; } .mobile-pick { display: block !important; } }

.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); align-self: start; max-height: calc(100vh - 90px); overflow: auto; padding-right: 4px; }
.sem { font: 700 0.75rem var(--font-display); text-transform: uppercase; letter-spacing: 0.1em; color: var(--margin); margin: 14px 0 6px; }
.topic-btn {
  display: grid; grid-template-columns: 2.1em minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%;
  text-align: left; background: none; border: 0; border-radius: 8px; padding: 7px 8px; color: var(--text); line-height: 1.25;
}
.topic-btn:hover { background: var(--soft); }
.topic-btn[aria-current="true"] { background: var(--card); box-shadow: inset 3px 0 0 var(--margin); font-weight: 700; }
.topic-btn .n { font: 700 0.85rem var(--font-mono); color: var(--muted); }
.chip { font: 600 0.72rem var(--font-mono); padding: 2px 6px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.good { background: var(--ok-bg); color: var(--ok); }
.chip.mid { background: var(--warn-bg); color: var(--warn); }
.chip.low { background: var(--bad-bg); color: var(--bad); }

.mobile-pick { display: none; margin-top: 14px; }
.mobile-pick select { width: 100%; padding: 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); font-size: 1rem; }

.main { min-width: 0; }
.topic-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.topic-head .num { font: 700 1rem var(--font-mono); color: var(--margin); }
.topic-head h1 { font-size: clamp(1.4rem, 3vw, 2rem); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
.tab {
  border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px;
  font: 600 0.92rem var(--font-display); color: var(--text); display: inline-flex; align-items: center; gap: 8px;
}
.tab[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.tab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); }

.sheet { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px 18px 34px; position: relative; }
.sheet::before { content: ""; position: absolute; left: 20px; top: 0; bottom: 0; width: 2px; background: var(--margin); opacity: 0.7; }
.sheet ul { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; }
.sheet li::marker { color: var(--margin); }
.example { margin-top: 16px; padding: 12px 14px; border-radius: 8px; background: var(--soft); border-left: 3px solid var(--accent); }
.example b { color: var(--ink); }
.go { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }

.intro { color: var(--muted); margin: 0 0 12px; max-width: 70ch; }
.qs { display: grid; gap: 12px; }
.q { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; }
.q.ok { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
.q.bad { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
.q-top { display: flex; gap: 10px; align-items: flex-start; }
.q-n { font: 700 0.95rem var(--font-mono); color: var(--paper); background: var(--c); border-radius: 6px; min-width: 1.9em; text-align: center; padding: 1px 4px; }
.q-text { flex: 1; min-width: 0; }
.q-pts { font: 600 0.8rem var(--font-mono); color: var(--muted); white-space: nowrap; }
.q-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.q-row input {
  font: 500 1rem var(--font-mono); padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line);
  background: var(--paper); width: min(260px, 100%);
}
.q-row input:focus { border-color: var(--accent); }
.unit { color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1.5px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 12px; text-align: left; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); font-weight: 700; }
.hint-btn { border: 1px dashed var(--warn); background: none; color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: 0.9rem; }
.hint { background: var(--warn-bg); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; }
.feedback { border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; }
.feedback.ok { background: var(--ok-bg); }
.feedback.bad { background: var(--bad-bg); }
.feedback b { font-family: var(--font-display); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.btn { border: 0; border-radius: 10px; padding: 11px 18px; font: 700 1rem var(--font-display); background: var(--ink); color: var(--paper); }
.btn.ghost { background: none; color: var(--ink); border: 1.5px solid var(--ink); }

.score { margin-top: 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center;
  background: var(--card); border: 2px solid var(--ink); border-radius: var(--radius); padding: 16px 18px; }
.grade { font: 700 3rem/1 var(--font-display); color: var(--ink); text-align: center; min-width: 2.2em; font-variant-numeric: tabular-nums; }
.grade small { display: block; font: 600 0.75rem var(--font-body); color: var(--muted); letter-spacing: 0.05em; }
.score h3 { font-size: 1.15rem; }
.bar { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--c, var(--ok)); }

.report { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px 14px; }
.report label { font: 600 0.9rem var(--font-display); color: var(--ink); }
.report input { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper); width: min(240px, 100%); }
.vchip { background: var(--soft); color: var(--ink); font-weight: 700; }
.home h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); }
.home p { max-width: 68ch; }
.how { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
@media (min-width: 1000px) { .how { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 480px) { .how { grid-template-columns: minmax(0, 1fr); } }
.how div { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.how b { display: block; font-family: var(--font-display); color: var(--ink); margin-bottom: 4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tcard { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; }
.tcard:hover { border-color: var(--ink); }
.tcard .n { font: 700 0.8rem var(--font-mono); color: var(--margin); }
.tcard .levels { display: flex; gap: 6px; flex-wrap: wrap; }

.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.85em; line-height: 1.05; margin: 0 1px; }
.fr > span:first-child { border-bottom: 1.3px solid currentColor; padding: 0 2px; }
.fr > span:last-child { padding: 0 2px; }
sup { line-height: 0; }
.vec { position: relative; display: inline-block; padding-top: 0.32em; line-height: 1; }
.vec::before { content: ""; position: absolute; left: 0.05em; right: 0.3em; top: 0.12em; border-top: 1.4px solid currentColor; }
.vec::after { content: ""; position: absolute; right: 0; top: calc(0.12em - 0.21em + 0.7px); border: 0.21em solid transparent; border-left: 0.34em solid currentColor; border-right-width: 0; }
@media (prefers-reduced-motion: no-preference) { .q, .tab, .btn { transition: border-color .15s, background-color .15s, box-shadow .15s; } }
</style>
</head>

 − √5)<sup>2<\/sup>) + √((3 − √5)<sup>2<\/sup>)."}, "type": "num", "answer": "2", "hint": {"ru": "√(a<sup>2<\/sup>) = |a|. Определи знак каждого выражения в скобках и раскрой модули.", "ro": "√(a<sup>2<\/sup>) = |a|. Aflați semnul fiecărei expresii din paranteze și explicitați modulele."}, "explain": {"ru": "√5 ≈ 2,24. |1 − √5| = √5 − 1, |3 − √5| = 3 − √5. Сумма: √5 − 1 + 3 − √5 = 2. Ответ: 2.", "ro": "√5 ≈ 2,24. |1 − √5| = √5 − 1, |3 − √5| = 3 − √5. Suma: √5 − 1 + 3 − √5 = 2. Răspuns: 2."}}, {"q": {"ru": "Упрости и вычисли: √((6 − √30)<sup>2<\/sup>) + √((2 − √30)<sup>2<\/sup>).", "ro": "Simplificați și calculați: √((6 − √30)<sup>2<\/sup>) + √((2 − √30)<sup>2<\/sup>)."}, "type": "num", "answer": "4", "hint": {"ru": "√(a<sup>2<\/sup>) = |a|. Определи знак каждого выражения в скобках и раскрой модули.", "ro": "√(a<sup>2<\/sup>) = |a|. Aflați semnul fiecărei expresii din paranteze și explicitați modulele."}, "explain": {"ru": "25 &lt; 30 &lt; 36, √30 ≈ 5,48. |6 − √30| = 6 − √30, |2 − √30| = √30 − 2. Сумма: 6 − √30 + √30 − 2 = 4. Ответ: 4.", "ro": "25 &lt; 30 &lt; 36, √30 ≈ 5,48. |6 − √30| = 6 − √30, |2 − √30| = √30 − 2. Suma: 6 − √30 + √30 − 2 = 4. Răspuns: 4."}}]}, {"q": {"ru": "Реши уравнение ||x| − 3| = 1. Запиши все корни через «;».", "ro": "Rezolvați ecuația ||x| − 3| = 1. Scrieți toate rădăcinile prin «;»."}, "type": "set", "answer": ["-4", "-2", "2", "4"], "hint": {"ru": "Сначала внешний модуль: |x| − a = b или |x| − a = −b. Отбрось случаи, где |x| получается отрицательным.", "ro": "Mai întâi modulul exterior: |x| − a = b sau |x| − a = −b. Eliminați cazurile în care |x| iese negativ."}, "explain": {"ru": "|x| − 3 = 1 ⇒ |x| = 4 ⇒ x = ±4;  |x| − 3 = −1 ⇒ |x| = 2 ⇒ x = ±2. Ответ: −4; −2; 2; 4.", "ro": "|x| − 3 = 1 ⇒ |x| = 4 ⇒ x = ±4;  |x| − 3 = −1 ⇒ |x| = 2 ⇒ x = ±2. Răspuns: −4; −2; 2; 4."}, "variants": [{"q": {"ru": "Реши уравнение ||x| − 2| = 5. Запиши все корни через «;».", "ro": "Rezolvați ecuația ||x| − 2| = 5. Scrieți toate rădăcinile prin «;»."}, "type": "s ": "num", "answer": "5", "hint": {"ru": "Нарисуй A и B над осью и выкинь из A ту часть, что покрыта B. Получится объединение двух промежутков — посчитай целые в каждом, следя за концами.", "ro": "Desenați A și B deasupra axei și eliminați din A partea acoperită de B. Se obține reuniunea a două intervale — numărați întregii din fiecare, atenți la capete."}, "explain": {"ru": "A \\ B = (−2; 1) ∪ (4; 7]. Целые: −1, 0 и 5, 6, 7. Всего 5. Ответ: 5.", "ro": "A \\ B = (−2; 1) ∪ (4; 7]. Întregii: −1, 0 și 5, 6, 7. În total 5. Răspuns: 5."}}, {"q": {"ru": "A = [−5; 5), B = (−1; 2]. Сколько целых чисел содержит A \\ B?", "ro": "A = [−5; 5), B = (−1; 2]. Câte numere întregi conține A \\ B?"}, "type": "num", "answer": "7", "hint": {"ru": "Нарисуй A и B над осью и выкинь из A ту часть, что покрыта B. Получится объединение двух промежутков — посчитай целые в каждом, следя за концами.", "ro": "Desenați A și B deasupra axei și eliminați din A partea acoperită de B. Se obține reuniunea a două intervale — numărați întregii din fiecare, atenți la capete."}, "explain": {"ru": "A \\ B = [−5; −1] ∪ (2; 5). Целые: −5, …, −1 — 5 чисел и 3, 4 — 2 числа. Всего 7. Ответ: 7.", "ro": "A \\ B = [−5; −1] ∪ (2; 5). Întregii: −5, …, −1 — 5 numere și 3, 4 — 2 numere. În total 7. Răspuns: 7."}}]}]]}, {"id": "03", "num": 3, "semester": 1, "title": {"ru": "Элементы математической логики. Индукция", "ro": "Elemente de logică matematică. Inducția"}, "cheat": {"ru": ["Высказывание — утверждение, которое либо истинно (И), либо ложно (Л). «x &gt; 3» — не высказывание: зависит от x.", "non p меняет значение. Отрицание «&gt;» — это «≤», отрицание «=» — «≠».", "p и q (p ∧ q) истинно, только если оба истинны; p или q (p ∨ q) ложно, только если оба ложны.", "p ⇒ q ложно лишь в одном случае: И ⇒ Л. p ⇔ q истинно, когда значения одинаковы.", "∀ — «для любого», ∃ — «существует». «Для всех» опровергает один контрпример. Отрицание: non (∀x: P) — это ∃x: non P.", "Если верно «A ⇒ B», то A — достаточное условие для B, а B — необходимое для A.", "Индукция: база — проверь P(1); шаг — из P(k) выведи P(k + 1); вывод — P(n) верно для всех n ≥ 1."], "ro": ["Propoziția este un enunț care este fie adevărat (A), fie fals (F). „x &gt; 3” nu este propoziție: depinde de x.", "non p schimbă valoarea. Negația lui „&gt;” este „≤”, negația lui „=” este „≠”.", "p și q (p ∧ q) este adevărată doar dacă ambele sunt adevărate; p sau q (p ∨ q) este falsă doar dacă ambele sunt false.", "p ⇒ q este falsă într-un singur caz: A ⇒ F. p ⇔ q este adevărată când valorile sunt la fel.", "∀ — „pentru orice”, ∃ — „există”. „Pentru toți” se infirmă cu un contraexemplu. Negația: non (∀x: P) este ∃x: non P.", "Dacă „A ⇒ B” este adevărată, A este condiție suficientă pentru B, iar B — condiție necesară pentru A.", "Inducția: baza — verificați P(1); pasul — din P(k) deduceți P(k + 1); concluzia — P(n) este adevărată pentru toți n ≥ 1."]}, "example": {"ru": "Пример: p: «√16 = 4» (И), q: «π ∈ ℚ» (Л). p и q — Л; p или q — И; p ⇒ q — Л (из истины ложь); q ⇒ p — И.", "ro": "Exemplu: p: „√16 = 4” (A), q: „π ∈ ℚ” (F). p și q — F; p sau q — A; p ⇒ q — F (din adevăr rezultă fals); q ⇒ p — A."}, "levels": [[{"q": {"ru": "Истинно или ложно высказывание «если 2 &gt; 5, то √9 = 4»?", "ro": "Este adevărată sau falsă propoziția „dacă 2 &gt; 5, atunci √9 = 4”?"}, "type": "choice", "options": {"ru": ["И (истинно)", "Л (ложно)"], "ro": ["A (adevărat)", "F (fals)"]}, "answer": 0, "hint": {"ru": "Сначала найди значение каждой простой части, потом примени таблицу истинности.", "ro": "Aflați mai întâi valoarea fiecărei părți simple, apoi aplicați tabelul de adevăr."}, "explain": {"ru": "Посылка «2 &gt; 5» ложна, а импликация с ложной посылкой истинна. Ответ: И (истинно).", "ro": "Ipoteza „2 &gt; 5” este falsă, iar implicația cu ipoteza falsă este adevărată. Răspuns: A (adevărat)."}, "variants": [{"q": {"ru": "Истинно или ложно высказывание «(−3)<sup>2<\/sup> = 9 и 7 — чётное число»?", "ro": "Este adevărată sau falsă propoziția „(−3)<sup>2<\/sup> = 9 și 7 este număr par”?"}, "type": "choice", "options": {"ru": ["И (истинно)", "Л (ложно)"], "ro": ["A (adevărat)", "F (fals)"]}, "answer": 1, "hint": {"ru": "Сначала найди значение каждой простой части, потом примени таблицу истинности.", "ro": "Aflați mai întâi valoarea fiecărei părți simple, apoi aplicați tabelul de adevăr."}, "explain": {"ru": "Вторая часть ложна, а конъюнкция истинна, только если истинны обе. Ответ: Л (ложно).", "ro": "A doua parte este falsă, iar conjuncția este adevărată doar dacă ambele sunt adevărate. Răspuns: F (fals)."}}, {"q": {"ru": "Истинно или ложно высказывание «√2 ∈ ℚ или 0 ∈ ℕ»?", "ro": "Este adevărată sau falsă propoziția „√2 ∈ ℚ sau 0 ∈ ℕ”?"}, "type": "choice", "options": {"ru": ["И (истинно)", "Л (ложно)"], "ro": ["A (adevărat)", "F (fals)"]}, "answer": 0, "hint": {"ru": "Сначала найди значение каждой простой части, потом примени таблицу истинности.", "ro": "Aflați mai întâi valoarea fiecărei părți simple, apoi aplicați tabelul de adevăr."}, "explain": {"ru": "«√2 ∈ ℚ» ложно, «0 ∈ ℕ» истинно; дизъюнкции достаточно одной истинной части. Ответ: И (истинно).", "ro": "„√2 ∈ ℚ” este falsă, „0 ∈ ℕ” este adevărată; disjuncției îi ajunge o parte adevărată. Răspuns: A (adevărat)."}}]}, {"q": {"ru": "Сколько высказываний среди предложений: «12 : 4 = 3»; «Открой приложение»; «x + 1 = 7»; «π &gt; 3»; «Кто выиграл матч?»", "ro": "Câte propoziții sunt printre enunțurile: „12 : 4 = 3”; „Deschide aplicația”; „x + 1 = 7”; „π &gt; 3”; „Cine a câștigat meciul?”"}, "type": "num", "answer": "2", "hint": {"ru": "Высказывание можно назвать истинным или ложным. Вопросы, просьбы и утверждения с неизвестной переменной (без «для всех») — не высказывания.", "ro": "Propoziția se poate numi adevărată sau falsă. Întrebările, rugămințile și enunțurile cu o variabilă necunoscută (fără „pentru orice”) nu sunt propoziții."}, "explain": {"ru": "Высказывания: «12 : 4 = 3» (И) и «π &gt; 3» (И). Просьба, вопрос и «x + 1 = 7» (зависит от x) — нет. Ответ: 2.", "ro": "Propoziții: „12 : 4 = 3” (A) și „π &gt; 3” (A). Rugămintea, întrebarea și „x + 1 = 7” (depinde de x) — nu. Răspuns: 2."}, "variants": [{"q": {"ru": "Сколько высказываний среди предложений: «2<sup>5<\/sup> = 32»; «Сделай скриншот»; «√2 — иррациональное число»; «для любого действительного x: x<sup>2<\/sup> ≥ 0»; «y &lt; 4»?", "ro": "Câte propoziții sunt printre enunțurile: „2<sup>5<\/sup> = 32”; „Fă o captură de ecran”; „√2 este număr irațional”; „pentru orice x real: x<sup>2<\/sup> ≥ 0”; „y &lt; 4”?"}, "type": "num", "answer": "3", "hint": {"ru": "Высказывание можно назвать истинным или ложным. Вопросы, просьбы и утверждения с неизвестной переменной (без «для всех») — не высказывания.", "ro": "Propoziția se poate numi adevărată sau falsă. Întrebările, rugămințile și enunțurile cu o variabilă necunoscută (fără „pentru orice”) nu sunt propoziții."}, "explain": {"ru": "Высказывания: «2<sup>5<\/sup> = 32», «√2 иррационально», «∀x: x<sup>2<\/sup> ≥ 0» (квантор делает его высказыванием). «y &lt; 4» зависит от y. Ответ: 3.", "ro": "Propoziții: „2<sup>5<\/sup> = 32”, „√2 este irațional”, „∀x: x<sup>2<\/sup> ≥ 0” (cuantificatorul o face propoziție). „y &lt; 4” depinde de y. Răspuns: 3."}}, {"q": {"ru": "Сколько высказываний среди предложений: «100 делится на 8»; «Подпишись на канал!»; «n + 3 = 10»; «0 ∈ ∅»; «1 + 1 = 2»; «3 &lt; √10»?", "ro": "Câte propoziții sunt printre enunțurile: „100 se împarte la 8”; „Abonează-te la canal!”; „n + 3 = 10”; „0 ∈ ∅”; „1 + 1 = 2”; „3 &lt; √10”?"}, "type": "num", "answer": "4", "hint": {"ru": "Высказывание можно назвать истинным или ложным. Вопросы, просьбы и утверждения с неизвестной переменной (без «для всех») — не высказывания.", "ro": "Propoziția se poate numi adevărată sau falsă. Întrebările, rugămințile și enunțurile cu o variabilă necunoscută (fără „pentru orice”) nu sunt propoziții."}, "explain": {"ru": "Высказывания: «100 делится на 8» (Л), «0 ∈ ∅» (Л), «1 + 1 = 2» (И), «3 &lt; √10» (И). Ложное высказывание — тоже высказывани ек, d = R — касательная, d &lt; R — секущая. Касательная ⊥ радиусу.", "Отрезки касательных из одной точки равны: AT = AK. Перпендикуляр из центра делит хорду пополам.", "Две окружности: O₁O₂ = R + r — касаются внешне, O₁O₂ = R − r — внутренне, R − r &lt; O₁O₂ &lt; R + r — пересекаются.", "Центральный угол = дуге; вписанный = {1/2} дуги; вписанный угол на диаметр = 90°.", "Хорды: AM · MB = CM · MD. Касательная и секущая из M: MT² = MA · MB."], "ro": ["Unghiurile adiacente suplementare au suma 180°; unghiurile opuse la vârf sunt congruente. Bisectoarea împarte unghiul în două.", "a ∥ b și o secantă: alterne interne congruente, corespondente congruente, interne de aceeași parte au suma 180° (și reciproc — criterii ∥).", "Suma unghiurilor triunghiului este 180°; unghiul exterior este egal cu suma celor două unghiuri interioare neadiacente cu el.", "Dreapta și cercul: d &gt; R — exterioară, d = R — tangentă, d &lt; R — secantă. Tangenta ⊥ rază.", "Segmentele tangentelor dintr-un punct sunt egale: AT = AK. Perpendiculara din centru împarte coarda în jumătăți.", "Două cercuri: O₁O₂ = R + r — tangente exterior, O₁O₂ = R − r — tangente interior, R − r &lt; O₁O₂ &lt; R + r — secante.", "Unghiul la centru = arcul; unghiul înscris = {1/2} din arc; unghiul înscris care se sprijină pe diametru = 90°.", "Coarde: AM · MB = CM · MD. Tangenta și secanta din M: MT² = MA · MB."]}, "example": {"ru": "Пример: AB — диаметр, M на окружности, ∠MAB = 35°. ∠AMB = 90° (опирается на диаметр), значит ∠MBA = 180° − 90° − 35° = 55°.", "ro": "Exemplu: AB este diametru, M pe cerc, ∠MAB = 35°. ∠AMB = 90° (se sprijină pe diametru), deci ∠MBA = 180° − 90° − 35° = 55°."}, "levels": [[{"q": {"ru": "Две прямые пересекаются, один из образовавшихся углов равен 58°. Найди наибольший из четырёх углов.", "ro": "Două drepte se intersectează, unul dintre unghiurile formate are 58°. Aflați cel mai mare dintre cele patru unghiuri."}, "type": "num", "answer": "122", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "Соседние углы — смежные (в сумме 180°), противоположные — вертикальные (равны).", "ro": "Unghiurile vecine sunt adiacente suplementare (suma 180°), cele opuse — opuse la vârf (congruente)."}, "explain": {"ru": "Углы: 58°, 122°, 58°, 122° (вертикальные равны, смежные дают 180°). Ответ: 122°.", "ro": "Unghiurile: 58°, 122°, 58°, 122° (opusele la vârf sunt congruente, adiacentele dau 180°). Răspuns: 122°."}, "variants": [{"q": {"ru": "Две прямые пересекаются, один из образовавшихся углов равен 47°. Найди наибольший из четырёх углов.", "ro": "Două drepte se intersectează, unul dintre unghiurile formate are 47°. Aflați cel mai mare dintre cele patru unghiuri."}, "type": "num", "answer": "133", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "Соседние углы — смежные (в сумме 180°), противоположные — вертикальные (равны).", "ro": "Unghiurile vecine sunt adiacente suplementare (suma 180°), cele opuse — opuse la vârf (congruente)."}, "explain": {"ru": "Углы: 47°, 133°, 47°, 133° (вертикальные равны, смежные дают 180°). Ответ: 133°.", "ro": "Unghiurile: 47°, 133°, 47°, 133° (opusele la vârf sunt congruente, adiacentele dau 180°). Răspuns: 133°."}}, {"q": {"ru": "Две прямые пересекаются, один из образовавшихся углов равен 71°. Найди наибольший из четырёх углов.", "ro": "Două drepte se intersectează, unul dintre unghiurile formate are 71°. Aflați cel mai mare dintre cele patru unghiuri."}, "type": "num", "answer": "109", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "Соседние углы — смежные (в сумме 180°), противоположные — вертикальные (равны).", "ro": "Unghiurile vecine sunt adiacente suplementare (suma 180°), cele opuse — opuse la vârf (congruente)."}, "explain": {"ru": "Углы: 71°, 109°, 71°, 109° (вертикальные равны, смежные дают 180°). Ответ: 109°.", "ro": "Unghiurile: 71°, 109°, 71°, 109° (opusele la vârf sunt congruente, adiacentele dau 180°). Răspuns: 109°."}}]}, {"q": {"ru": "Точки A, B, C лежат на окружности, дуга BC, не содержащая A, равна 136°. Найди вписанный угол BAC.", "ro": "Punctele A, B, C se află pe un cerc, arcul BC care nu conține A are 136°. Aflați unghiul înscris BAC."}, "type": "num", "answer": "68", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "Вписанный угол равен половине дуги, на которую опирается; центральный — всей дуге.", "ro": "Unghiul înscris este jumătate din arcul pe care se sprijină; unghiul la centru este egal cu arcul."}, "explain": {"ru": "∠BAC = {1/2} · 136° = 68°. Ответ: 68°.", "ro": "∠BAC = {1/2} · 136° = 68°. Răspuns: 68°."}, "variants": [{"q": {"ru": "O — центр окружности, центральный угол BOC = 98°, точка A лежит на большей дуге BC. Найди ∠BAC.", "ro": "O este centrul cercului, unghiul la centru BOC = 98°, punctul A se află pe arcul mare BC. Aflați ∠BAC."}, "type": "num", "answer": "49", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "Вписанный угол равен половине дуги, на которую опирается; центральный — всей дуге.", "ro": "Unghiul înscris este jumătate din arcul pe care se sprijină; unghiul la centru este egal cu arcul."}, "explain": {"ru": "∠BAC опирается на ту же дугу, что и ∠BOC: ∠BAC = 98° : 2 = 49°. Ответ: 49°.", "ro": "∠BAC se sprijină pe același arc ca ∠BOC: ∠BAC = 98° : 2 = 49°. Răspuns: 49°."}}, {"q": {"ru": "Вписанный угол равен 41°. Найди центральный угол, опирающийся на ту же дугу.", "ro": "Un unghi înscris are 41°. Aflați unghiul la centru care se sprijină pe același arc."}, "type": "num", "answer": "82", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "Вписанный угол равен половине дуги, на которую опирается; центральный — всей дуге.", "ro": "Unghiul înscris este jumătate din arcul pe care se sprijină; unghiul la centru este egal cu arcul."}, "explain": {"ru": "Центральный угол вдвое больше вписанного: 2 · 41° = 82°. Ответ: 82°.", "ro": "Unghiul la centru este dublul celui înscris: 2 · 41° = 82°. Răspuns: 82°."}}]}, {"q": {"ru": "Дрон доставки летает в зоне — круге радиусом 7 км вокруг склада. Прямое шоссе проходит на расстоянии 6,5 км от склада. Как расположена прямая шоссе относительно границы зоны (окружности)?", "ro": "O dronă de livrare zboară într-o zonă — disc de rază 7 km în jurul depozitului. O șosea dreaptă trece la distanța de 6,5 km de depozit. Cum este situată dreapta șoselei față de marginea zonei (cerc)?"}, "type": "choice", "answer": 2, "options": {"ru": ["не имеет общих точек с окружностью", "касательная", "секущая (2 общие точки)"], "ro": ["exterioară cercului (0 puncte comune)", "tangentă", "secantă (2 puncte comune)"]}, "hint": {"ru": "Сравни расстояние d от центра до прямой с радиусом R.", "ro": "Comparați distanța d de la centru la dreaptă cu raza R."}, "explain": {"ru": "d = 6,5 км, R = 7 км: d &lt; R. Ответ: секущая.", "ro": "d = 6,5 km, R = 7 km: d &lt; R. Răspuns: secantă."}, "variants": [{"q": {"ru": "Радиус окружности 4,5 см, расстояние от центра до прямой 4,5 см. Как расположены прямая и окружность?", "ro": "Raza cercului este 4,5 cm, distanța de la centru la dreaptă este 4,5 cm. Cum sunt situate dreapta și cercul?"}, "type": "choice", "answer": 1, "options": {"ru": ["не имеет общих точек с окружностью", "касательная", "секущая (2 общие точки)"], "ro": ["exterioară cercului (0 puncte comune)", "tangentă", "secantă (2 puncte comune)"]}, "hint": {"ru": "Сравни расстояние d от центра до прямой с радиусом R.", "ro": "Comparați distanța d de la centru la dreaptă cu raza R."}, "explain": {"ru": "d = 4,5 см, R = 4,5 см: d = R. Ответ: касательная.", "ro": "d = 4,5 cm, R = 4,5 cm: d = R. Răspuns: tangentă."}}, {"q": {"ru": "Колонка «добивает» на 12 м (граница звука — окружность радиусом 12 м). Прямая беговая дорожка проходит в 12,4 м от колонки. Как расположена прямая дорожки относительно этой окружности?", "ro": "O boxă se aude până la 12 m (marginea sunetului — cerc de rază 12 m). O pistă dreaptă de alergare trece la 12,4 m de boxă. Cum este situată dreapta pistei față de acest cerc?"}, "type": "choice", "answer": 0, "options": {"ru": ["не имеет общих точек с окружностью", "касательная", "секущая (2 общие точки)"], "r  + r și cu R − r — ambele numere, nu doar suma."}, "explain": {"ru": "R + r = 8,5, R − r = 3,5; 3,5 = 6 − 2,5. Ответ: касаются внутренне.", "ro": "R + r = 8,5, R − r = 3,5; 3,5 = 6 − 2,5. Răspuns: tangente interior."}}, {"q": {"ru": "Окружности радиусов 9 и 4, расстояние между центрами 12. Как расположены окружности?", "ro": "Cercurile au razele 9 și 4, distanța dintre centre este 12. Cum sunt situate cercurile?"}, "type": "choice", "answer": 0, "options": {"ru": ["пересекаются (2 общие точки)", "касаются внутренне", "одна внутри другой, общих точек нет", "касаются внешне"], "ro": ["secante (2 puncte comune)", "tangente interior", "unul în interiorul celuilalt, fără puncte comune", "tangente exterior"]}, "hint": {"ru": "Сравни O₁O₂ с R + r и с R − r — оба числа, а не только сумму.", "ro": "Comparați O₁O₂ cu R + r și cu R − r — ambele numere, nu doar suma."}, "explain": {"ru": "R + r = 13, R − r = 5; 5 &lt; 12 &lt; 13. Ответ: пересекаются (2 общие точки).", "ro": "R + r = 13, R − r = 5; 5 &lt; 12 &lt; 13. Răspuns: secante (2 puncte comune)."}}]}]]}, {"id": "08", "num": 8, "semester": 1, "title": {"ru": "Треугольники: конгруэнтность, подобие, замечательные точки", "ro": "Triunghiuri: congruență, asemănare, puncte remarcabile"}, "cheat": {"ru": ["Вид треугольника — по наибольшему углу. Неравенство треугольника: наибольшая сторона меньше суммы двух других.", "Признаки конгруэнтности: СУС (угол между сторонами), УСУ (сторона и два прилежащих угла), ССС. ССУ и УУУ — не признаки.", "Равнобедренный треугольник: углы при основании равны; медиана к основанию — и биссектриса, и высота.", "Подобие с коэффициентом k: стороны, периметры, медианы, высоты ×k; площади ×k². Признаки: два угла; две стороны и угол между ними; три стороны.", "Прямая ∥ стороне отсекает подобный треугольник. Фалес: параллельные прямые отсекают на сторонах угла пропорциональные отрезки.", "Биссектриса BK: {AK/KC} = {AB/BC}. Средняя линия ∥ третьей стороне и равна её половине.", "Медианы пересекаются в G и делятся 2 : 1 от вершины. Центр описанной окружности — пересечение серединных перпендикуляров; у прямоугольного R = {c/2}.", "Центр вписанной окружности — пересечение биссектрис; r = {S/p}, у прямоугольного r = {a + b − c/2}."], "ro": ["Tipul triunghiului — după unghiul cel mai mare. Inegalitatea triunghiului: latura cea mai mare este mai mică decât suma celorlalte două.", "Criterii de congruență: LUL (unghiul dintre laturi), ULU (latura și cele două unghiuri alăturate), LLL. LLU și UUU nu sunt criterii.", "Triunghiul isoscel: unghiurile de la bază sunt congruente; mediana dusă la bază este și bisectoare, și înălțime.", "Asemănare de raport k: laturile, perimetrele, medianele, înălțimile ×k; ariile ×k². Criterii: două unghiuri; două laturi și unghiul dintre ele; trei laturi.", "O dreaptă ∥ cu o latură determină un triunghi asemenea. Thales: dreptele paralele determină pe laturile unghiului segmente proporționale.", "Bisectoarea BK: {AK/KC} = {AB/BC}. Linia mijlocie este ∥ cu a treia latură și egală cu jumătate din ea.", "Medianele se intersectează în G, care le împarte 2 : 1 de la vârf. Centrul cercului circumscris — intersecția mediatoarelor; la triunghiul dreptunghic R = {c/2}.", "Centrul cercului înscris — intersecția bisectoarelor; r = {S/p}, la triunghiul dreptunghic r = {a + b − c/2}."]}, "example": {"ru": "Пример: в △ABC MN ∥ AC (M на AB, N на BC), BM = 3, MA = 6, AC = 12. BA = 9, k = {3/9} = {1/3}, MN = {1/3} · 12 = 4.", "ro": "Exemplu: în △ABC MN ∥ AC (M pe AB, N pe BC), BM = 3, MA = 6, AC = 12. BA = 9, k = {3/9} = {1/3}, MN = {1/3} · 12 = 4."}, "levels": [[{"q": {"ru": "Фасад палатки — равнобедренный треугольник, угол при основании 38°. Найди угол при вершине.", "ro": "Fațada unui cort este un triunghi isoscel, unghiul de la bază are 38°. Aflați unghiul din vârf."}, "type": "num", "answer": "104", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "Углы при основании равнобедренного треугольника равны; сумма углов 180°.", "ro": "Unghiurile de la baza triunghiu  треугольника", "в середине стороны"], "ro": ["în interiorul triunghiului", "într-un vârf al triunghiului", "în exteriorul triunghiului", "în mijlocul unei laturi"]}, "hint": {"ru": "Найди углы (сумма 180°) и определи вид треугольника по наибольшему углу.", "ro": "Aflați unghiurile (suma 180°) și stabiliți tipul triunghiului după unghiul cel mai mare."}, "explain": {"ru": "Углы 30°, 60°, 90° — треугольник прямоугольный, центр — середина гипотенузы. Ответ: в середине стороны.", "ro": "Unghiurile 30°, 60°, 90° — triunghiul este dreptunghic, centrul este mijlocul ipotenuzei. Răspuns: în mijlocul unei laturi."}}, {"q": {"ru": "Углы треугольника относятся как 4 : 5 : 6. Где лежит его ортоцентр?", "ro": "Unghiurile unui triunghi sunt în raportul 4 : 5 : 6. Unde se află ortocentrul lui?"}, "type": "choice", "answer": 0, "options": {"ru": ["внутри треугольника", "в вершине треугольника", "вне треугольника", "в середине стороны"], "ro": ["în interiorul triunghiului", "într-un vârf al triunghiului", "în exteriorul triunghiului", "în mijlocul unei laturi"]}, "hint": {"ru": "Найди углы (сумма 180°) и определи вид треугольника по наибольшему углу.", "ro": "Aflați unghiurile (suma 180°) și stabiliți tipul triunghiului după unghiul cel mai mare."}, "explain": {"ru": "Углы 48°, 60°, 72° — все острые, треугольник остроугольный. Ответ: внутри треугольника.", "ro": "Unghiurile 48°, 60°, 72° — toate ascuțite, triunghiul este ascuțitunghic. Răspuns: în interiorul triunghiului."}}]}]]}, {"id": "09", "num": 9, "semester": 1, "title": {"ru": "Метрические соотношения в треугольнике", "ro": "Relații metrice în triunghi"}, "cheat": {"ru": ["Прямоугольный треугольник: sin α = {a/c}, cos α = {b/c}, tg α = {a/b}; катет против 30° равен половине гипотенузы.", "Теорема катета a² = c · a_{c}; теорема высоты h² = a_{c} · b_{c}; Пифагор c² = a² + b²; h = {ab/c}.", "Вид треугольника: c — наибольшая сторона; c² = a² + b² — прямоугольный, c² &lt; a² + b² — остроугольный, c² &gt; — тупоугольный.", "sin (180° − α) = sin α, cos (180° − α) = −cos α: у тупого угла косинус отрицателен.", "Теорема косинусов: a² = b² + c² − 2bc · cos A; cos A = {b² + c² − a²/2bc}.", "Теорема синусов: {a/sin A} = {b/sin B} = {c/sin C} = 2R.", "Площадь: S = {1/2} ab · sin C. Параллелограмм: d₁² + d₂² = 2(a² + b²).", "Две стороны и угол против одной из них: решений может быть 0, 1 или 2."], "ro": ["Triunghiul dreptunghic: sin α = {a/c}, cos α = {b/c}, tg α = {a/b}; cateta opusă unghiului de 30° este jumătate din ipotenuză.", "Teorema catetei a² = c · a_{c}; teorema înălțimii h² = a_{c} · b_{c}; Pitagora c² = a² + b²; h = {ab/c}.", "Tipul triunghiului: c — latura cea mai mare; c² = a² + b² — dreptunghic, c² &lt; a² + b² — ascuțitunghic, c² &gt; — obtuzunghic.", "sin (180° − α) = sin α, cos (180° − α) = −cos α: la unghiul obtuz cosinusul este negativ.", "Teorema cosinusului: a² = b² + c² − 2bc · cos A; cos A = {b² + c² − a²/2bc}.", "Teorema sinusurilor: {a/sin A} = {b/sin B} = {c/sin C} = 2R.", "Aria: S = {1/2} ab · sin C. Paralelogramul: d₁² + d₂² = 2(a² + b²).", "Două laturi și unghiul opus uneia dintre ele: pot exista 0, 1 sau 2 soluții."]}, "example": {"ru": "Пример: b = 5, c = 3, A = 120°. a² = 25 + 9 − 2 · 5 · 3 · (−{1/2}) = 49, a = 7; 2R = {7/sin 120°} = {14/√3}.", "ro": "Exemplu: b = 5, c = 3, A = 120°. a² = 25 + 9 − 2 · 5 · 3 · (−{1/2}) = 49, a = 7; 2R = {7/sin 120°} = {14/√3}."}, "levels": [[{"q": {"ru": "Наклонная доска скейт-рампы имеет длину 2,5 м, синус угла её наклона к земле равен 0,28. На какой высоте верхний край доски?", "ro": "Placa înclinată a unei rampe de skateboard are lungimea 2,5 m, sinusul unghiului de înclinare față de sol este 0,28. La ce înălțime se află marginea de sus a plăcii?"}, "type": "num", "answer": "0.7", "unit": {"ru": "м", "ro": "m"}, "hint": {"ru": "sin α = {противолежащий катет/гипотенуза}, cos α = {прилежащий катет/гипотенуза}.", "ro": "sin α = {cateta opusă/ipotenuză}, cos α = {cateta alăturată/ipotenuză}."}, "explain": {"ru": "Высота — катет против 2 = 36, h = 6. Răspuns: 6."}, "variants": [{"q": {"ru": "Высота прямоугольного треугольника, проведённая к гипотенузе, делит её на отрезки 4 и 25. Найди эту высоту.", "ro": "Înălțimea unui triunghi dreptunghic dusă la ipotenuză o împarte în segmentele 4 și 25. Aflați această înălțime."}, "type": "num", "answer": "10", "hint": {"ru": "Теорема высоты: h² = a_{c} · b_{c} (произведение проекций катетов).", "ro": "Teorema înălțimii: h² = a_{c} · b_{c} (produsul proiecțiilor catetelor)."}, "explain": {"ru": "h² = 4 · 25 = 100, h = 10. Ответ: 10.", "ro": "h² = 4 · 25 = 100, h = 10. Răspuns: 10."}}, {"q": {"ru": "Высота прямоугольного треугольника, проведённая к гипотенузе, делит её на отрезки 1,6 и 10. Найди эту высоту.", "ro": "Înălțimea unui triunghi dreptunghic dusă la ipotenuză o împarte în segmentele 1,6 și 10. Aflați această înălțime."}, "type": "num", "answer": "4", "hint": {"ru": "Теорема высоты: h² = a_{c} · b_{c} (произведение проекций катетов).", "ro": "Teorema înălțimii: h² = a_{c} · b_{c} (produsul proiecțiilor catetelor)."}, "explain": {"ru": "h² = 1,6 · 10 = 16, h = 4. Ответ: 4.", "ro": "h² = 1,6 · 10 = 16, h = 4. Răspuns: 4."}}]}, {"q": {"ru": "Стороны треугольника 6, 9 и 11. Определи его вид по углам.", "ro": "Laturile unui triunghi sunt 6, 9 și 11. Stabiliți tipul lui după unghiuri."}, "type": "choice", "answer": 2, "options": {"ru": ["остроугольный", "прямоугольный", "тупоугольный"], "ro": ["ascuțitunghic", "dreptunghic", "obtuzunghic"]}, "hint": {"ru": "Сравни квадрат наибольшей стороны с суммой квадратов двух других.", "ro": "Comparați pătratul celei mai mari laturi cu suma pătratelor celorlalte două."}, "explain": {"ru": "11² = 121, 6² + 9² = 36 + 81 = 117; 121 &gt; 117. Ответ: тупоугольный.", "ro": "11² = 121, 6² + 9² = 36 + 81 = 117; 121 &gt; 117. Răspuns: obtuzunghic."}, "variants": [{"q": {"ru": "Стороны треугольника 20, 21 и 29. Определи его вид по углам.", "ro": "Laturile unui triunghi sunt 20, 21 și 29. Stabiliți tipul lui după unghiuri."}, "type": "choice", "answer": 1, "options": {"ru": ["остроугольный", "прямоугольный", "тупоугольный"], "ro": ["ascuțitunghic", "dreptunghic", "obtuzunghic"]}, "hint": {"ru": "Сравни квадрат наибольшей стороны с суммой квадратов двух других.", "ro": "Comparați pătratul celei mai mari laturi cu suma pătratelor celorlalte două."}, "explain": {"ru": "29² = 841, 20² + 21² = 400 + 441 = 841; 841 = 841. Ответ: прямоугольный.", "ro": "29² = 841, 20² + 21² = 400 + 441 = 841; 841 = 841. Răspuns: dreptunghic."}}, {"q": {"ru": "Стороны треугольника 10, 11 и 14. Определи его вид по углам.", "ro": "Laturile unui triunghi sunt 10, 11 și 14. Stabiliți tipul lui după unghiuri."}, "type": "choice", "answer": 0, "options": {"ru": ["остроугольный", "прямоугольный", "тупоугольный"], "ro": ["ascuțitunghic", "dreptunghic", "obtuzunghic"]}, "hint": {"ru": "Сравни квадрат наибольшей стороны с суммой квадратов двух других.", "ro": "Comparați pătratul celei mai mari laturi cu suma pătratelor celorlalte două."}, "explain": {"ru": "14² = 196, 10² + 11² = 100 + 121 = 221; 196 &lt; 221. Ответ: остроугольный.", "ro": "14² = 196, 10² + 11² = 100 + 121 = 221; 196 &lt; 221. Răspuns: ascuțitunghic."}}]}, {"q": {"ru": "Треугольная клумба: две её стороны 10 м и 7 м, угол между ними 150°. Найди площадь клумбы.", "ro": "Un strat de flori triunghiular: două laturi au 10 m și 7 m, unghiul dintre ele 150°. Aflați aria stratului."}, "type": "num", "answer": "17.5", "unit": {"ru": "м²", "ro": "m²"}, "hint": {"ru": "S = {1/2} ab · sin C; синус тупого угла: sin (180° − α) = sin α.", "ro": "S = {1/2} ab · sin C; sinusul unghiului obtuz: sin (180° − α) = sin α."}, "explain": {"ru": "sin 150° = 0,5; S = {1/2} · 10 · 7 · 0,5 = 17,5 м². Ответ: 17,5 м².", "ro": "sin 150° = 0,5; S = {1/2} · 10 · 7 · 0,5 = 17,5 m². Răspuns: 17,5 m²."}, "variants": [{"q": {"ru": "Треугольный баннер: две стороны 12 м и 9 м, угол между ними 30°. Найди площадь баннера.", "ro": "Un banner triunghiular: două laturi au 12 m și 9 m, unghiul dintre e (−0,25)²) = {√15/4}; S = {1/2} · 4 · 6 · {√15/4} = 3√15. Ответ: 3√15.", "ro": "cos C = {4² + 6² − 8²/2 · 4 · 6} = −0,25; sin C = √(1 − (−0,25)²) = {√15/4}; S = {1/2} · 4 · 6 · {√15/4} = 3√15. Răspuns: 3√15."}}]}]]}, {"id": "10", "num": 10, "semester": 1, "title": {"ru": "Многочлены", "ro": "Polinoame"}, "profile": "real", "cheat": {"ru": ["Одночлен: коэффициент + буквенная часть; степень — сумма показателей. Складывают только подобные одночлены.", "Степень многочлена — наибольшая степень его членов; grad (P · Q) = grad P + grad Q. Многочлены равны ⇔ равны коэффициенты при одинаковых степенях.", "Формулы: (a ± b)², a² − b² = (a − b)(a + b), a³ ± b³ = (a ± b)(a² ∓ ab + b²).", "Деление с остатком: D(X) = I(X) · C(X) + R(X), grad R &lt; grad I.", "Схема Горнера (деление на X − c): все коэффициенты, включая нули; «нижнее × c + верхнее»; последнее число — остаток. Для X + 3 c = −3.", "Теорема Безу: остаток от деления P(X) на X − c равен P(c); c — корень ⇔ P(X) делится на X − c.", "Целые корни — среди делителей свободного члена; P(1) = сумма коэффициентов. Кратность — сколько раз подряд делится на X − c.", "Над ℝ неприводимы: многочлены 1-й степени и квадратные трёхчлены с D &lt; 0."], "ro": ["Monomul: coeficient + parte literală; gradul — suma exponenților. Se adună doar monoamele asemenea.", "Gradul polinomului — cel mai mare grad al termenilor; grad (P · Q) = grad P + grad Q. Polinoame egale ⇔ coeficienți egali la aceleași puteri.", "Formule: (a ± b)², a² − b² = (a − b)(a + b), a³ ± b³ = (a ± b)(a² ∓ ab + b²).", "Împărțirea cu rest: D(X) = I(X) · C(X) + R(X), grad R &lt; grad I.", "Schema lui Horner (împărțirea la X − c): toți coeficienții, inclusiv cei nuli; „cel de jos × c + cel de sus”; ultimul număr — restul. Pentru X + 3 c = −3.", "Teorema lui Bézout: restul împărțirii lui P(X) la X − c este P(c); c este rădăcină ⇔ P(X) se divide cu X − c.", "Rădăcinile întregi — printre divizorii termenului liber; P(1) = suma coeficienților. Ordinul de multiplicitate — de câte ori la rând se divide cu X − c.", "Peste ℝ sunt ireductibile: polinoamele de gradul întâi și trinoamele de gradul doi cu D &lt; 0."]}, "example": {"ru": "Пример: X³ − 4X² + X + 6, c = 2. Горнер: 1, −2, −3 | 0 → X³ − 4X² + X + 6 = (X − 2)(X² − 2X − 3) = (X − 2)(X − 3)(X + 1).", "ro": "Exemplu: X³ − 4X² + X + 6, c = 2. Horner: 1, −2, −3 | 0 → X³ − 4X² + X + 6 = (X − 2)(X² − 2X − 3) = (X − 2)(X − 3)(X + 1)."}, "levels": [[{"q": {"ru": "Найди степень одночлена (−2X²Y)³ · 3XY⁴.", "ro": "Aflați gradul monomului (−2X²Y)³ · 3XY⁴."}, "type": "num", "answer": "14", "hint": {"ru": "Приведи одночлен к стандартному виду: при умножении степеней с одинаковым основанием показатели складываются, при возведении в степень — умножаются. Степень — сумма показателей всех переменных.", "ro": "Aduceți monomul la forma standard: la înmulțirea puterilor cu aceeași bază exponenții se adună, la ridicarea la putere — se înmulțesc. Gradul — suma exponenților tuturor variabilelor."}, "explain": {"ru": "(−2X²Y)³ · 3XY⁴ = −24X⁷Y⁷, 7 + 7 = 14; степень 14. Ответ: 14.", "ro": "(−2X²Y)³ · 3XY⁴ = −24X⁷Y⁷, 7 + 7 = 14; gradul 14. Răspuns: 14."}, "variants": [{"q": {"ru": "Найди степень одночлена (3XY³)² · (−X²Z).", "ro": "Aflați gradul monomului (3XY³)² · (−X²Z)."}, "type": "num", "answer": "11", "hint": {"ru": "Приведи одночлен к стандартному виду: при умножении степеней с одинаковым основанием показатели складываются, при возведении в степень — умножаются. Степень — сумма показателей всех переменных.", "ro": "Aduceți monomul la forma standard: la înmulțirea puterilor cu aceeași bază exponenții se adună, la ridicarea la putere — se înmulțesc. Gradul — suma exponenților tuturor variabilelor."}, "explain": {"ru": "(3XY³)² · (−X²Z) = −9X⁴Y⁶Z, 4 + 6 + 1 = 11; степень 11. Ответ: 11.", "ro": "(3XY³)² · (−X²Z) = −9X⁴Y⁶Z, 4 + 6 + 1 = 11; gradul 11. Răspuns: 11."}}, {"q": {"ru": "Найди степень одночлена 4X³Y · (−XY²Z)².", "ro": "Aflați gradul monomului 4X³Y · (−XY²Z)²."}, "type": "num", "answer": "12", "hint": {"ru" , "{2(X + 2)/X}, X ≠ 0, X ≠ −2", "2X − 4, X ≠ −2", "{2(X − 2)/X}, X ≠ 0, X ≠ −2"]}, "hint": {"ru": "Сократи, а условия возьми из ИСХОДНОГО знаменателя: ОДЗ после сокращения может стать шире.", "ro": "Simplificați, iar condițiile luați-le din numitorul INIȚIAL: după simplificare DVA poate deveni mai larg."}, "explain": {"ru": "{2(X − 2)(X + 2)/X(X + 2)} = {2(X − 2)/X}; исходный знаменатель X(X + 2) ≠ 0. Ответ: {2(X − 2)/X}, X ≠ 0, X ≠ −2.", "ro": "{2(X − 2)(X + 2)/X(X + 2)} = {2(X − 2)/X}; numitorul inițial X(X + 2) ≠ 0. Răspuns: {2(X − 2)/X}, X ≠ 0, X ≠ −2."}}]}]]}, {"id": "12", "num": 12, "semester": 2, "title": {"ru": "Числовые функции и их свойства", "ro": "Funcții numerice și proprietățile lor"}, "cheat": {"ru": ["Функция f: A → B каждому x ∈ A ставит в соответствие единственное y = f(x). D(f) — допустимые x, E(f) — получаемые значения y.", "D(f): знаменатель ≠ 0, под корнем чётной степени ≥ 0, под логарифмом &gt; 0. Все условия берём одновременно (пересечение).", "t ∈ E(f), если уравнение f(x) = t имеет решение. У параболы E(f) находим по вершине x<sub>0<\/sub> = −{b/2a}.", "(g ∘ f)(x) = g(f(x)): сначала f, потом g; в общем случае f ∘ g ≠ g ∘ f. D(f + g) = D(f · g) = D(f) ∩ D(g).", "Чётная: f(−x) = f(x), график симметричен относительно Oy; нечётная: f(−x) = −f(x), симметрия относительно O. Сначала проверь симметричность D(f)!", "Периодическая с периодом T: f(x + T) = f(x), значит f(x + kT) = f(x) при любом целом k.", "У f(x) = ax<sup>2<\/sup> + bx + c экстремум в вершине: при a &gt; 0 — минимум, при a &lt; 0 — максимум.", "Обратная функция: из y = f(x) вырази x через y и поменяй x и y местами. D(f<sup>−1<\/sup>) = E(f); графики симметричны относительно y = x."], "ro": ["Funcția f: A → B asociază fiecărui x ∈ A un unic y = f(x). D(f) — valorile x admise, E(f) — valorile y obținute.", "D(f): numitorul ≠ 0, sub radicalul de ordin par ≥ 0, sub logaritm &gt; 0. Toate condițiile se iau simultan (intersecția).", "t ∈ E(f), dacă ecuația f(x) = t are soluție. La parabolă E(f) se află după vârful x<sub>0<\/sub> = −{b/2a}.", "(g ∘ f)(x) = g(f(x)): mai întâi f, apoi g; în cazul general f ∘ g ≠ g ∘ f. D(f + g) = D(f · g) = D(f) ∩ D(g).", "Pară: f(−x) = f(x), graficul simetric față de Oy; impară: f(−x) = −f(x), simetrie față de O. Mai întâi verificați simetria lui D(f)!", "Periodică cu perioada T: f(x + T) = f(x), deci f(x + kT) = f(x) pentru orice k întreg.", "La f(x) = ax<sup>2<\/sup> + bx + c extremul este în vârf: pentru a &gt; 0 — minim, pentru a &lt; 0 — maxim.", "Funcția inversă: din y = f(x) exprimați x prin y și schimbați între ele x și y. D(f<sup>−1<\/sup>) = E(f); graficele sunt simetrice față de y = x."]}, "example": {"ru": "Пример: f(x) = x<sup>2<\/sup> − 6x + 5 = (x − 3)<sup>2<\/sup> − 4. Вершина (3; −4), ветви вверх: E(f) = [−4; +∞), убывает на (−∞; 3], возрастает на [3; +∞), минимум −4 при x = 3; нули x = 1 и x = 5.", "ro": "Exemplu: f(x) = x<sup>2<\/sup> − 6x + 5 = (x − 3)<sup>2<\/sup> − 4. Vârful (3; −4), ramurile în sus: E(f) = [−4; +∞), descrește pe (−∞; 3], crește pe [3; +∞), minimul −4 pentru x = 3; zerourile x = 1 și x = 5."}, "levels": [[{"q": {"ru": "Для f(x) = 2x<sup>2<\/sup> − 3x + 1 найди f(−2).", "ro": "Pentru f(x) = 2x<sup>2<\/sup> − 3x + 1 aflați f(−2)."}, "type": "num", "answer": "15", "hint": {"ru": "Подставь число вместо x, обязательно в скобках; квадрат отрицательного числа положителен.", "ro": "Substituiți numărul în locul lui x, neapărat în paranteze; pătratul unui număr negativ este pozitiv."}, "explain": {"ru": "f(−2) = 2 · (−2)<sup>2<\/sup> − 3 · (−2) + 1 = 8 + 6 + 1 = 15. Ответ: 15.", "ro": "f(−2) = 2 · (−2)<sup>2<\/sup> − 3 · (−2) + 1 = 8 + 6 + 1 = 15. Răspuns: 15."}, "variants": [{"q": {"ru": "Для f(x) = 3x<sup>2<\/sup> + 2x − 5 найди f(−1).", "ro": "Pentru f(x) = 3x<sup>2<\/sup> + 2x − 5 aflați f(−1)."}, "type": "num", "answer": "-4", "hint": {"ru": "Подставь число вместо x, обязательно в скобках; квадрат отрицательного числа положителен.", "ro": "Substituiți numărul în locul lui x, neapărat  внешнюю.", "ro": "(g ∘ f)(x) = g(f(x)): mai întâi calculăm funcția interioară (cea din dreapta), apoi substituim rezultatul în cea exterioară."}, "explain": {"ru": "g(900) = 850, затем f(850) = 0,9 · 850 = 765 (леев). Ответ: 765.", "ro": "g(900) = 850, apoi f(850) = 0,9 · 850 = 765 (lei). Răspuns: 765."}}, {"q": {"ru": "f(x) = 3 − x, g(x) = x<sup>2<\/sup> + 1. Найди (g ∘ f)(5).", "ro": "f(x) = 3 − x, g(x) = x<sup>2<\/sup> + 1. Aflați (g ∘ f)(5)."}, "type": "num", "answer": "5", "hint": {"ru": "(g ∘ f)(x) = g(f(x)): сначала считаем внутреннюю функцию (стоит справа), затем подставляем результат во внешнюю.", "ro": "(g ∘ f)(x) = g(f(x)): mai întâi calculăm funcția interioară (cea din dreapta), apoi substituim rezultatul în cea exterioară."}, "explain": {"ru": "f(5) = 3 − 5 = −2, затем g(−2) = 4 + 1 = 5. Ответ: 5.", "ro": "f(5) = 3 − 5 = −2, apoi g(−2) = 4 + 1 = 5. Răspuns: 5."}}]}, {"q": {"ru": "Исследуй на чётность функцию f(x) = x<sup>3<\/sup> − 5x.", "ro": "Studiați paritatea funcției f(x) = x<sup>3<\/sup> − 5x."}, "type": "choice", "options": {"ru": ["чётная", "нечётная", "ни чётная, ни нечётная"], "ro": ["pară", "impară", "nici pară, nici impară"]}, "answer": 1, "hint": {"ru": "Сначала проверь, симметрична ли D(f) относительно 0. Затем вычисли f(−x) и сравни с f(x) и −f(x).", "ro": "Mai întâi verificați dacă D(f) este simetric față de 0. Apoi calculați f(−x) și comparați cu f(x) și −f(x)."}, "explain": {"ru": "D(f) = ℝ симметрична. f(−x) = −x<sup>3<\/sup> + 5x = −(x<sup>3<\/sup> − 5x) = −f(x). Ответ: нечётная.", "ro": "D(f) = ℝ este simetric. f(−x) = −x<sup>3<\/sup> + 5x = −(x<sup>3<\/sup> − 5x) = −f(x). Răspuns: impară."}, "variants": [{"q": {"ru": "Исследуй на чётность функцию f(x) = x<sup>4<\/sup> − 3x<sup>2<\/sup> + |x|.", "ro": "Studiați paritatea funcției f(x) = x<sup>4<\/sup> − 3x<sup>2<\/sup> + |x|."}, "type": "choice", "options": {"ru": ["чётная", "нечётная", "ни чётная, ни нечётная"], "ro": ["pară", "impară", "nici pară, nici impară"]}, "answer": 0, "hint": {"ru": "Сначала проверь, симметрична ли D(f) относительно 0. Затем вычисли f(−x) и сравни с f(x) и −f(x).", "ro": "Mai întâi verificați dacă D(f) este simetric față de 0. Apoi calculați f(−x) și comparați cu f(x) și −f(x)."}, "explain": {"ru": "D(f) = ℝ. f(−x) = x<sup>4<\/sup> − 3x<sup>2<\/sup> + |−x| = x<sup>4<\/sup> − 3x<sup>2<\/sup> + |x| = f(x). Ответ: чётная.", "ro": "D(f) = ℝ. f(−x) = x<sup>4<\/sup> − 3x<sup>2<\/sup> + |−x| = x<sup>4<\/sup> − 3x<sup>2<\/sup> + |x| = f(x). Răspuns: pară."}}, {"q": {"ru": "Исследуй на чётность функцию f(x) = x<sup>2<\/sup>, x ∈ [−2; 5].", "ro": "Studiați paritatea funcției f(x) = x<sup>2<\/sup>, x ∈ [−2; 5]."}, "type": "choice", "options": {"ru": ["чётная", "нечётная", "ни чётная, ни нечётная"], "ro": ["pară", "impară", "nici pară, nici impară"]}, "answer": 2, "hint": {"ru": "Сначала проверь, симметрична ли D(f) относительно 0. Затем вычисли f(−x) и сравни с f(x) и −f(x).", "ro": "Mai întâi verificați dacă D(f) este simetric față de 0. Apoi calculați f(−x) și comparați cu f(x) și −f(x)."}, "explain": {"ru": "4 ∈ D(f), а −4 ∉ D(f): область определения не симметрична, дальше считать не нужно. Ответ: ни чётная, ни нечётная.", "ro": "4 ∈ D(f), iar −4 ∉ D(f): domeniul de definiție nu este simetric, mai departe nu trebuie calculat. Răspuns: nici pară, nici impară."}}]}, {"q": {"ru": "Функция f периодическая с периодом 4, f(1) = 7, f(2) = −3. Найди f(13).", "ro": "Funcția f este periodică cu perioada 4, f(1) = 7, f(2) = −3. Aflați f(13)."}, "type": "num", "answer": "7", "hint": {"ru": "f(x + kT) = f(x) при любом целом k: прибавляй или вычитай период, пока не попадёшь в известную точку.", "ro": "f(x + kT) = f(x) pentru orice k întreg: adunați sau scădeți perioada până ajungeți într-un punct cunoscut."}, "explain": {"ru": "13 = 1 + 3 · 4, поэтому f(13) = f(1) = 7. Ответ: 7.", "ro": "13 = 1 + 3 · 4, de aceea f(13) = f(1) = 7. Răspuns: 7."}, "variants": [{"q": {"ru": "Функция f периодическая с периодом 5, f(0) = 4, f(2) = −3. Найди f(  разбери a, при которых A = 0 (до сокращения!).", "Система двух линейных уравнений: a<sub>1<\/sub>b<sub>2<\/sub> − a<sub>2<\/sub>b<sub>1<\/sub> ≠ 0 — одно решение; = 0 — прямые параллельны (нет решений) или совпадают (бесконечно много)."], "ro": ["f(x) = ax + b (a ≠ 0): graficul — o dreaptă; pentru a &gt; 0 crește, pentru a &lt; 0 descrește; zeroul x = −{b/a}.", "ax + b = 0: a ≠ 0 — o rădăcină x = −{b/a}; a = 0 și b = 0 — orice x; a = 0, b ≠ 0 — nu are soluții.", "Soluția unui sistem de două ecuații este perechea (x; y). Metode: substituția, reducerea, metoda grafică (punctul de intersecție al dreptelor).", "Sistemul (acoladă) — „și”, intersecția soluțiilor; totalitatea (paranteză pătrată) — „sau”, reuniunea.", "La înmulțirea sau împărțirea inecuației la un număr negativ semnul se schimbă: −2x &gt; 6 ⇔ x &lt; −3.", "|f(x)| ≤ g(x) ⇔ −g(x) ≤ f(x) ≤ g(x); |f(x)| ≥ g(x) ⇔ f(x) ≥ g(x) sau f(x) ≤ −g(x).", "Parametrul: aduceți la forma A · x = B și analizați separat a pentru care A = 0 (înainte de simplificare!).", "Sistemul de două ecuații liniare: a<sub>1<\/sub>b<sub>2<\/sub> − a<sub>2<\/sub>b<sub>1<\/sub> ≠ 0 — o soluție; = 0 — dreptele sunt paralele (nicio soluție) sau coincid (o infinitate)."]}, "example": {"ru": "Пример: (a<sup>2<\/sup> − 4)x = a + 2, то есть (a − 2)(a + 2)x = a + 2. a = −2: 0 · x = 0, x — любое; a = 2: 0 · x = 4, решений нет; a ≠ ±2: x = {1/a − 2}.", "ro": "Exemplu: (a<sup>2<\/sup> − 4)x = a + 2, adică (a − 2)(a + 2)x = a + 2. a = −2: 0 · x = 0, x — orice; a = 2: 0 · x = 4, nu are soluții; a ≠ ±2: x = {1/a − 2}."}, "levels": [[{"q": {"ru": "Реши уравнение 4(x − 3) − 2(x + 1) = 6.", "ro": "Rezolvați ecuația 4(x − 3) − 2(x + 1) = 6."}, "type": "num", "answer": "10", "hint": {"ru": "Раскрой скобки, перенеси слагаемые с x влево, числа вправо, приведи подобные.", "ro": "Desfaceți parantezele, treceți termenii cu x în stânga, numerele în dreapta, reduceți termenii asemenea."}, "explain": {"ru": "4x − 12 − 2x − 2 = 6 ⇔ 2x − 14 = 6 ⇔ 2x = 20 ⇔ x = 10. Ответ: 10.", "ro": "4x − 12 − 2x − 2 = 6 ⇔ 2x − 14 = 6 ⇔ 2x = 20 ⇔ x = 10. Răspuns: 10."}, "variants": [{"q": {"ru": "Реши уравнение 5(x + 2) − 3(x − 4) = 30.", "ro": "Rezolvați ecuația 5(x + 2) − 3(x − 4) = 30."}, "type": "num", "answer": "4", "hint": {"ru": "Раскрой скобки, перенеси слагаемые с x влево, числа вправо, приведи подобные.", "ro": "Desfaceți parantezele, treceți termenii cu x în stânga, numerele în dreapta, reduceți termenii asemenea."}, "explain": {"ru": "5x + 10 − 3x + 12 = 30 ⇔ 2x + 22 = 30 ⇔ 2x = 8 ⇔ x = 4. Ответ: 4.", "ro": "5x + 10 − 3x + 12 = 30 ⇔ 2x + 22 = 30 ⇔ 2x = 8 ⇔ x = 4. Răspuns: 4."}}, {"q": {"ru": "Реши уравнение 0,5(6x − 4) = 2x + 3.", "ro": "Rezolvați ecuația 0,5(6x − 4) = 2x + 3."}, "type": "num", "answer": "5", "hint": {"ru": "Раскрой скобки, перенеси слагаемые с x влево, числа вправо, приведи подобные.", "ro": "Desfaceți parantezele, treceți termenii cu x în stânga, numerele în dreapta, reduceți termenii asemenea."}, "explain": {"ru": "3x − 2 = 2x + 3 ⇔ x = 5. Ответ: 5.", "ro": "3x − 2 = 2x + 3 ⇔ x = 5. Răspuns: 5."}}]}, {"q": {"ru": "Во время игры заряд телефона через t минут равен f(t) = 85 − 0,5t (%). Через сколько минут телефон разрядится до 0 %?", "ro": "În timpul jocului încărcarea telefonului după t minute este f(t) = 85 − 0,5t (%). După câte minute telefonul se descarcă până la 0 %?"}, "type": "num", "answer": "170", "unit": {"ru": "мин", "ro": "min"}, "hint": {"ru": "Нуль линейной функции: реши уравнение f(t) = 0.", "ro": "Zeroul funcției de gradul I: rezolvați ecuația f(t) = 0."}, "explain": {"ru": "85 − 0,5t = 0 ⇔ 0,5t = 85 ⇔ t = 170. Ответ: 170.", "ro": "85 − 0,5t = 0 ⇔ 0,5t = 85 ⇔ t = 170. Răspuns: 170."}, "variants": [{"q": {"ru": "Заряд батареи дрона в полёте через t минут равен f(t) = 100 − 2,5t (%). Через сколько минут батарея сядет до 0 %?", "ro": "Încărcarea bateriei unei drone în zbor după t minute este f(t) = 100 − 2,5t (%). După câte minute bateria se descarcă până la 0 %?"}, "type": "num", "answer": "40", "unit": мся к x.", "Неравенства: при a &gt; 1 знак сохраняется — log<sub>a<\/sub> f &gt; log<sub>a<\/sub> g ⇔ f &gt; g &gt; 0; при 0 &lt; a &lt; 1 знак меняется — ⇔ 0 &lt; f &lt; g.", "Число записываем как логарифм: b = log<sub>a<\/sub> a<sup>b<\/sup>; например, −2 = log<sub>0,5<\/sub> 4."], "ro": ["y = log<sub>a<\/sub> x (a &gt; 0, a ≠ 1): D = (0; +∞), E = ℝ, graficul trece prin (1; 0); funcția inversă este y = a<sup>x<\/sup>.", "a &gt; 1 — funcția este crescătoare, 0 &lt; a &lt; 1 — descrescătoare: log<sub>0,5<\/sub> 4 &lt; log<sub>0,5<\/sub> 2.", "DVA: sub logaritm un număr &gt; 0; dacă x este în bază — baza &gt; 0 și ≠ 1. Aflăm DVA înainte de transformări.", "Ecuația cea mai simplă: log<sub>a<\/sub> f(x) = b ⇔ f(x) = a<sup>b<\/sup>.", "log<sub>a<\/sub> f(x) = log<sub>a<\/sub> g(x) ⇔ f(x) = g(x), f(x) &gt; 0. Suma logaritmilor o înlocuim cu logaritmul produsului, la sfârșit înlăturăm rădăcinile străine.", "Schimbarea t = log<sub>a<\/sub> x (t — orice număr); după rezolvare revenim obligatoriu la x.", "Inecuații: pentru a &gt; 1 semnul se păstrează — log<sub>a<\/sub> f &gt; log<sub>a<\/sub> g ⇔ f &gt; g &gt; 0; pentru 0 &lt; a &lt; 1 semnul se schimbă — ⇔ 0 &lt; f &lt; g.", "Numărul îl scriem ca logaritm: b = log<sub>a<\/sub> a<sup>b<\/sup>; de exemplu, −2 = log<sub>0,5<\/sub> 4."]}, "example": {"ru": "Пример: log<sub>3<\/sub> (x + 1) + log<sub>3<\/sub> (x + 3) = 1. ОДЗ: x &gt; −1. (x + 1)(x + 3) = 3 ⇔ x² + 4x = 0 ⇔ x = 0 или x = −4; −4 не входит в ОДЗ. Ответ: x = 0.", "ro": "Exemplu: log<sub>3<\/sub> (x + 1) + log<sub>3<\/sub> (x + 3) = 1. DVA: x &gt; −1. (x + 1)(x + 3) = 3 ⇔ x² + 4x = 0 ⇔ x = 0 sau x = −4; −4 nu aparține DVA. Răspuns: x = 0."}, "levels": [[{"q": {"ru": "Реши уравнение log<sub>3<\/sub> (2x + 5) = 2.", "ro": "Rezolvați ecuația log<sub>3<\/sub> (2x + 5) = 2."}, "type": "num", "answer": "2", "hint": {"ru": "По определению: log<sub>a<\/sub> f(x) = b ⇔ f(x) = a<sup>b<\/sup>.", "ro": "După definiție: log<sub>a<\/sub> f(x) = b ⇔ f(x) = a<sup>b<\/sup>."}, "expla pragul. Aflați L."}, "type": "num", "answer": "110", "unit": {"ru": "дБ", "ro": "dB"}, "hint": {"ru": "lg 10<sup>n<\/sup> = n.", "ro": "lg 10<sup>n<\/sup> = n."}, "explain": {"ru": "L = 10 · lg 10<sup>11<\/sup> = 10 · 11 = 110 дБ. Ответ: 110.", "ro": "L = 10 · lg 10<sup>11<\/sup> = 10 · 11 = 110 dB. Răspuns: 110."}, "variants": [{"q": {"ru": "Громкость звука: L = 10 lg {I/I₀}. Музыка в наушниках мощнее порога слышимости в 10<sup>8<\/sup> раз. Найди L.", "ro": "Nivelul sunetului: L = 10 lg {I/I₀}. Muzica din căști este de 10<sup>8<\/sup> ori mai puternică decât pragul de audibilitate. Aflați L."}, "type": "num", "answer": "80", "unit": {"ru": "дБ", "ro": "dB"}, "hint": {"ru": "lg 10<sup>n<\/sup> = n.", "ro": "lg 10<sup>n<\/sup> = n."}, "explain": {"ru": "L = 10 · lg 10<sup>8<\/sup> = 10 · 8 = 80 дБ. Ответ: 80.", "ro": "L = 10 · lg 10<sup>8<\/sup> = 10 · 8 = 80 dB. Răspuns: 80."}}, {"q": {"ru": "Громкость звука: L = 10 lg {I/I₀}. Шёпот друга на уроке мощнее порога слышимости в 1000 раз. Найди L.", "ro": "Nivelul sunetului: L = 10 lg {I/I₀}. Șoapta unui prieten la lecție este de 1000 de ori mai puternică decât pragul de audibilitate. Aflați L."}, "type": "num", "answer": "30", "unit": {"ru": "дБ", "ro": "dB"}, "hint": {"ru": "lg 10<sup>n<\/sup> = n.", "ro": "lg 10<sup>n<\/sup> = n."}, "explain": {"ru": "1000 = 10³, L = 10 · lg 10³ = 10 · 3 = 30 дБ. Ответ: 30.", "ro": "1000 = 10³, L = 10 · lg 10³ = 10 · 3 = 30 dB. Răspuns: 30."}}]}, {"q": {"ru": "Сколько целых чисел входит в область определения функции y = lg (9 − x²)?", "ro": "Câte numere întregi aparțin domeniului de definiție al funcției y = lg (9 − x²)?"}, "type": "num", "answer": "5", "hint": {"ru": "Под логарифмом должно быть положительное число: реши неравенство.", "ro": "Sub logaritm trebuie să fie un număr pozitiv: rezolvați inecuația."}, "explain": {"ru": "9 − x² &gt; 0 ⇔ x² &lt; 9 ⇔ −3 &lt; x &lt; 3. Целые: −2, −1, 0, 1, 2 (±3 не входят — строгое неравенство). Ответ: 5.", "ro": "9 − x² &gt; 0 ⇔ x² &lt; 9 ⇔ −3 ольник: формула Герона S = √(p(p − a)(p − b)(p − c)), p — полупериметр; S = pr; S = {abc/4R}.", "Круг S = πR², сектор S = πR² · {α/360}. Описанная трапеция: высота равна диаметру вписанной окружности."], "ro": ["Paralelogramul: laturile și unghiurile opuse sunt congruente, diagonalele se înjumătățesc, unghiurile alăturate au suma 180°. Dreptunghiul — diagonale congruente, rombul — perpendiculare.", "Trapezul: linia mijlocie m = {a + b/2}; în trapezul isoscel înălțimea taie din baza mare {a − b/2}.", "Patrulaterul înscris: ∠A + ∠C = ∠B + ∠D = 180°. Patrulaterul circumscris unui cerc: AB + CD = BC + AD.", "n-gonul: suma unghiurilor 180°(n − 2), numărul diagonalelor {n(n − 3)/2}, suma unghiurilor exterioare 360°.", "n-gonul regulat: unghiul interior {180°(n − 2)/n}, exterior {360°/n}; a = 2R sin {180°/n}, r = R cos {180°/n}; la hexagon a = R.", "Arii: paralelogram ah = ab sin α; romb {1/2}d₁d₂; triunghi {1/2}ah = {1/2}ab sin C; trapez {a + b/2} · h.", "Triunghiul: formula lui Heron S = √(p(p − a)(p − b)(p − c)), p — semiperimetrul; S = pr; S = {abc/4R}.", "Discul S = πR², sectorul S = πR² · {α/360}. Trapezul circumscris: înălțimea este egală cu diametrul cercului înscris."]}, "example": {"ru": "Пример: равнобокая трапеция с основаниями 14 и 4 и боковой стороной 13. Высота отсекает {14 − 4/2} = 5, h = √(13² − 5²) = 12, S = {14 + 4/2} · 12 = 108.", "ro": "Exemplu: trapez isoscel cu bazele 14 și 4 și latura neparalelă 13. Înălțimea taie {14 − 4/2} = 5, h = √(13² − 5²) = 12, S = {14 + 4/2} · 12 = 108."}, "levels": [[{"q": {"ru": "Сумма углов выпуклого многоугольника равна 1440°. Сколько у него сторон?", "ro": "Suma unghiurilor unui poligon convex este 1440°. Câte laturi are el?"}, "type": "num", "answer": "10", "hint": {"ru": "Сумма углов n-угольника 180°(n − 2).", "ro": "Suma unghiurilor n-gonului este 180°(n − 2)."}, "explain": {"ru": "180°(n − 2) = 1440°, n − 2 = 8, n = 10. Ответ: 10.", "ro": "180°(n − 2) = 1440°, n − 2 = 8, n = 10. Răspuns: 10."}, "variants": [{"q": {" ь трапеции.", "ro": "Diagonalele trapezului ABCD (AD ∥ BC) se intersectează în punctul O. Ariile triunghiurilor AOD și BOC sunt 18 și 8. Aflați aria trapezului."}, "type": "num", "answer": "50", "hint": {"ru": "Треугольники BOC и DOA подобны с коэффициентом √({S₂/S₁}); каждый боковой треугольник имеет площадь √(S₁S₂). Итого S = (√S₁ + √S₂)².", "ro": "Triunghiurile BOC și DOA sunt asemenea cu coeficientul √({S₂/S₁}); fiecare triunghi lateral are aria √(S₁S₂). În total S = (√S₁ + √S₂)²."}, "explain": {"ru": "Боковые треугольники по √(18 · 8) = √144 = 12. S = 18 + 8 + 2 · 12 = 50. Ответ: 50.", "ro": "Triunghiurile laterale au câte √(18 · 8) = √144 = 12. S = 18 + 8 + 2 · 12 = 50. Răspuns: 50."}}]}, {"q": {"ru": "У выпуклого многоугольника 35 диагоналей. Сколько у него сторон?", "ro": "Un poligon convex are 35 de diagonale. Câte laturi are?"}, "type": "num", "answer": "10", "hint": {"ru": "Число диагоналей {n(n − 3)/2}: получится квадратное уравнение относительно n.", "ro": "Numărul diagonalelor {n(n − 3)/2}: se obține o ecuație de gradul doi în raport cu n."}, "explain": {"ru": "{n(n − 3)/2} = 35 ⇔ n² − 3n − 70 = 0 ⇔ n = 10 (n = −7 не подходит). Ответ: 10.", "ro": "{n(n − 3)/2} = 35 ⇔ n² − 3n − 70 = 0 ⇔ n = 10 (n = −7 nu se potrivește). Răspuns: 10."}, "variants": [{"q": {"ru": "У выпуклого многоугольника 54 диагонали. Сколько у него сторон?", "ro": "Un poligon convex are 54 de diagonale. Câte laturi are?"}, "type": "num", "answer": "12", "hint": {"ru": "Число диагоналей {n(n − 3)/2}: получится квадратное уравнение относительно n.", "ro": "Numărul diagonalelor {n(n − 3)/2}: se obține o ecuație de gradul doi în raport cu n."}, "explain": {"ru": "n² − 3n − 108 = 0 ⇔ n = 12 (n = −9 не подходит). Ответ: 12.", "ro": "n² − 3n − 108 = 0 ⇔ n = 12 (n = −9 nu se potrivește). Răspuns: 12."}}, {"q": {"ru": "У выпуклого многоугольника 90 диагоналей. Сколько у него сторон?", "ro": "Un poligon convex are 90 de diagonale. Câte laturi are?"}, "type": "num", "answer": "15", "hint": {"ru"
