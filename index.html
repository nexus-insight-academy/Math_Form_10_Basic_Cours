      homeTitle: "Recapitulăm matematica de clasa a X-a", homeText: (n) => `${n} ${n < 20 ? "teme" : "de teme"} din programă. Fiecare are o fișă de sinteză scurtă și exerciții pe trei niveluri: de bază, mediu și avansat. Răspunsurile se verifică imediat, iar la sfârșit primești punctele și nota pe scara de 10. Rezultatele se păstrează în acest browser.`,
      how: [["1. Fișa de sinteză", "Citește regulile principale ale temei și exemplul rezolvat."], ["2. Trei niveluri", "De bază — aplicarea regulii, mediu — probleme în 2–3 pași, avansat — cu capcane."], ["3. Indicii", "Te-ai blocat — deschide indiciul. Nu dă răspunsul, dar întrebarea valorează de două ori mai puțin."], ["4. Puncte și notă", "După verificare vezi unde e greșeala, răspunsul corect și rezolvarea."]],
      notTried: "neparcurs", pickLabel: "Tema", profReal: "Real", profHum: "Umanist", profAria: "Profilul",
      profNote: "Alegeți profilul sus în dreapta: la profilul umanist temele „Polinoame”, „Fracții algebrice” și trigonometria nu se studiază și sunt ascunse.",
      variant: (k, n) => `Varianta ${k} din ${n}`, newVariant: "La reluare, exercițiile vor fi puțin diferite.",
      name: "Numele elevului", namePh: "scrie numele pentru raport", pdf: "Descarcă rezultatul (PDF)",
      pdfWork: "Pregătesc PDF-ul…", pdfSaved: "PDF-ul a fost salvat.", pdfNoLib: "Modulul PDF nu s-a încărcat — verifică internetul.",
      pdfUnavailable: "Descărcarea fișierelor nu este disponibilă în această fereastră.", pdfFail: "PDF-ul nu a putut fi salvat. Mai încearcă o dată.",
      pdfTitle: "Rezultatul testului", pdfStudent: "Elev", pdfDate: "Data", pdfLevel: "Nivelul", pdfScore: "Puncte",
      pdfGrade: "Nota", pdfYour: "Răspunsul elevului", pdfRight: "Răspunsul corect", pdfSolution: "Rezolvare",
      pdfHintUsed: "a folosit indiciul (punctele ×½)", pdfPoints: "Puncte pentru exercițiu", pdfOk: "corect", pdfBad: "greșit",
      pdfTopic: "Tema", pdfFile: "Matematica10"
    }
  };
  const LEVEL_COLORS = ["var(--l1)", "var(--l2)", "var(--l3)"];

  const store = {
    get(k, d) { try { const v = localStorage.getItem("mate10:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("mate10:" + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };
  // "" is replaced at build time: "" = bilingual, "ro" = Romanian-only build
  const ONLY_LANG = "";
  let lang = ONLY_LANG || store.get("lang", "ru");
  let current = store.get("topic", null); // topic id or null for home
  const HAS_PROFILES = TOPICS.some((t) => t.profile);
  let profile = store.get("profile", "real");          // "real" | "hum"
  const VIS = () => TOPICS.filter((t) => profile === "real" || !t.profile);
  let tab = "sheet";                       // "sheet" | 0 | 1 | 2
  let state = {};                          // per-render answers {qi: {value, hint}}

  const T = () => UI[lang];
  const esc = (s) => String(s);
  // Stacked fractions: {a/b} → markup; leave set notation {1, 2} untouched
  const fmt = (s) => esc(s).replace(/\{([^{}\/<>]+)\/([^{}<>]+)\}/g, '<span class="fr"><span>$1</span><span>$2</span></span>')
    .replace(/<v>(.*?)<\/v>/g, '<span class="vec">$1</span>');  // vector: arrow drawn over all letters
  const L = (obj) => (obj && (obj[lang] ?? obj.ru)) || "";

  // ---------- answer parsing ----------
  function parseNum(raw) {
    let s = String(raw).trim().replace(/[−–—]/g, "-").replace(/\s+/g, " ").replace(/%$/, "").trim();
    // Allow thousands separated by spaces ("3 040 007") when the answer is not a fraction.
    if (!s.includes("/")) s = s.replace(/(\d) (?=\d{3}(?!\d))/g, "$1");
    s = s.replace(/(\d),(\d)/g, "$1.$2");
    let m;
    if ((m = s.match(/^(-?)(\d+) (\d+)\/(\d+)$/))) { const v = +m[2] + (+m[3]) / (+m[4]); return m[1] ? -v : v; }
    if ((m = s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/))) { return (+m[1]) / (+m[2]); }
    if ((m = s.match(/^-?\d*\.?\d+$/))) { return +s; }
    return NaN;
  }
  const close = (a, b, tol) => Math.abs(a - b) <= Math.max(tol || 0, 1e-9 * Math.max(1, Math.abs(b)));
  function checkAnswer(q, value) {
    if (q.type === "choice") return value === q.answer;
    if (value == null || String(value).trim() === "") return false;
    if (q.type === "num") {
      const v = parseNum(value);
      if (isNaN(v)) return false;
      // A fraction like 1/3 has no exact decimal: accept a decimal rounded to hundredths or finer (0,33; 0,333)
      const den = (String(q.answer).match(/\/(\d+)$/) || [])[1];
      const periodic = den && ((n) => { while (n % 2 === 0) n /= 2; while (n % 5 === 0) n /= 5; return n !== 1; })(+den);
      const decimals = (String(value).replace(",", ".").split(".")[1] || "").length;
      const tol = periodic && decimals >= 2 ? Math.max(q.tol || 0, 0.006) : q.tol;
      return close(v, parseNum(q.answer), tol);
    }
    if (q.type === "set") {
      const parts = String(value).replace(/[{}]/g, "").split(/[;\n]/).map((x) => x.trim()).filter(Boolean).map(parseNum);
      const want = q.answer.map(parseNum);
      if (parts.length !== want.length || parts.some(isNaN)) return false;
      if (q.ordered) return parts.every((v, i) => close(v, want[i], q.tol));
      const a = [...parts].sort((x, y) => x - y), b = [...want].sort((x, y) => x - y);
      return a.every((v, i) => close(v, b[i], q.tol));
    }
    return false;
  }
  function answerText(q) {
    if (q.type === "choice") return L(q.options)[q.answer];
    // "2 1/2" → 2{1/2}, "-5/12" → −{5/12}: fmt() then draws stacked fractions
    const show = (a) => String(a).replace(/\./g, ",")
      .replace(/^(-?)(\d+) (\d+)\/(\d+)$/, "$1$2{$3/$4}").replace(/^(-?)(\d+)\/(\d+)$/, "$1{$2/$3}")
      .replace(/-/g, "−");
    if (q.type === "set") return q.answer.map(show).join("; ");
    return show(q.answer) + (q.unit ? " " + L(q.unit) : "");
  }
  const dec = (x) => String(Math.round(x * 100) / 100).replace(".", ",");  // decimal comma for RU/RO
  const gradeOf = (pct) => pct >= 95 ? 10 : pct >= 85 ? 9 : pct >= 75 ? 8 : pct >= 65 ? 7 : pct >= 55 ? 6 : pct >= 45 ? 5 : pct >= 35 ? 4 : pct >= 25 ? 3 : pct >= 15 ? 2 : 1;
  const chipClass = (pct) => pct == null ? "" : pct >= 75 ? "good" : pct >= 50 ? "mid" : "low";
  function topicBest(t) {
    const r = [0, 1, 2].map((l) => store.get(`best:${t.id}:${l}`, null)).filter((x) => x != null);
    if (!r.length) return null;
    return Math.round(r.reduce((a, b) => a + b, 0) / 3);
  }

  // ---------- variants: each completed attempt moves the level to its next variant ----------
  let variant = 0;
  let lastResult = null; // {t, l, variant, rows, got, max, pct, grade} for the PDF report
  const nVariants = (t, l) => 1 + Math.min(...t.levels[l].map((q) => (q.variants || []).length));
  const pickVariant = (t, l) => store.get(`attempt:${t.id}:${l}`, 0) % nVariants(t, l);
  const qAt = (q) => (variant === 0 || !q.variants || !q.variants[variant - 1]) ? q : { ...q, ...q.variants[variant - 1] };

  // ---------- PDF report ----------
  const dlPromise = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(() => null) : Promise.resolve(undefined);
  const plain = (s) => String(s).replace(/<v>(.*?)<\/v>/g, "$1\u20D7").replace(/<sup>(.*?)<\/sup>/g, "^$1").replace(/<br\s*\/?>/g, " ").replace(/<[^>]+>/g, "")
    .replace(/(\d)\{([^{}\/]+)\/([^{}]+)\}/g, "$1 $2/$3").replace(/\{([^{}\/]+)\/([^{}]+)\}/g, "$1/$2")
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&").replace(/&quot;/g, '"');
  function setPdfStatus(msg) { const el = document.getElementById("pdf-status"); if (el) el.textContent = msg; }
  function buildPdf(R) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    doc.addFileToVFS("DV.ttf", document.getElementById("font-r").textContent.trim());
    doc.addFont("DV.ttf", "DV", "normal");
    doc.addFileToVFS("DVB.ttf", document.getElementById("font-b").textContent.trim());
    doc.addFont("DVB.ttf", "DV", "bold");
    const NAVY = [31, 58, 104], TEXT = [34, 48, 63], GRAY = [106, 119, 136], OK = [30, 138, 76], BAD = [200, 54, 63];
    const X = 16, W = 178;
    // logo at the top of the report (first page)
    const LOGO_W = 34, LOGO_H = LOGO_W * 1106 / 2842;
    doc.addImage(document.getElementById("logo").src, "PNG", X, 10, LOGO_W, LOGO_H);
    let y = 10 + LOGO_H + 7;
    const put = (txt, { size = 10, bold = false, color = TEXT, indent = 0, after = 1.2 } = {}) => {
      doc.setFont("DV", bold ? "bold" : "normal"); doc.setFontSize(size); doc.setTextColor(...color);
      for (const ln of doc.splitTextToSize(plain(txt), W - indent)) {
        if (y > 280) { doc.addPage(); y = 18; }
        doc.text(ln, X + indent, y); y += size * 0.43;
      }
      y += after;
    };
    const name = store.get("student", "") || "—";
    const date = new Date().toLocaleDateString(lang === "ru" ? "ru-RU" : "ro-RO");
    put(T().brand + " · " + T().pdfTitle, { size: 9, color: GRAY, after: 4 });
    put(`${R.t.num === 0 ? "" : T().pdfTopic + " " + R.t.num + ". "}${L(R.t.title)}`, { size: 16, bold: true, color: NAVY, after: 1.5 });
    put(`${T().pdfLevel} ${R.l + 1} (${T().levelName[R.l]}) · ${T().variant(R.variant + 1, R.nVar)} · ${T().pdfDate}: ${date}`, { size: 10, color: GRAY });
    put(`${T().pdfStudent}: ${name}`, { size: 11, bold: true });
    doc.setDrawColor(...NAVY); doc.setFillColor(238, 243, 249);
    doc.roundedRect(X, y, W, 14, 2, 2, "FD");
    doc.setFont("DV", "bold"); doc.setFontSize(12); doc.setTextColor(...NAVY);
    doc.text(`${T().pdfScore}: ${dec(R.got)} / ${R.max}  (${R.pct}%)`, X + 5, y + 9);
    doc.text(`${T().pdfGrade}: ${R.grade}`, X + W - 5, y + 9, { align: "right" });
    y += 21;
    R.rows.forEach((r, i) => {
      if (y > 250) { doc.addPage(); y = 18; }
      doc.setDrawColor(214, 222, 232); doc.line(X, y - 4, X + W, y - 4);
      put(`${i + 1}. ${L(r.q.q)}`, { size: 10.5, bold: true, after: 1.5 });
      put(`${T().pdfYour}: ${r.given || "—"}   [${r.ok ? T().pdfOk : T().pdfBad}]`, { size: 10, color: r.ok ? OK : BAD, indent: 4, after: 0.8 });
      put(`${T().pdfRight}: ${answerText(r.q)}`, { size: 10, indent: 4, after: 0.8 });
      put(`${T().pdfPoints}: ${dec(r.pts)} / ${r.base}${r.hint ? " — " + T().pdfHintUsed : ""}`, { size: 9, color: GRAY, indent: 4, after: 0.8 });
      put(`${T().pdfSolution}: ${L(r.q.explain)}`, { size: 9, color: GRAY, indent: 4, after: 5 });
    });
    const pages = doc.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
      doc.setPage(p); doc.setFont("DV", "normal"); doc.setFontSize(8); doc.setTextColor(...GRAY);
      doc.text(`${name} · ${L(R.t.title)}`.slice(0, 90), X, 290);
      doc.text(`${p} / ${pages}`, X + W, 290, { align: "right" });
    }
    return doc.output("blob");
  }
  async function savePdf() {
    const R = lastResult;
    if (!R) return;
    if (!window.jspdf) { setPdfStatus(T().pdfNoLib); return; }
    setPdfStatus(T().pdfWork);
    let blob;
    try { blob = buildPdf(R); } catch (e) { setPdfStatus(T().pdfFail); return; }
    const who = (store.get("student", "") || "").trim().replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, "_");
    const filename = `${T().pdfFile}_${R.t.num === 0 ? "Ugly" : T().pdfTopic + String(R.t.num).padStart(2, "0")}_L${R.l + 1}_V${R.variant + 1}${who ? "_" + who : ""}.pdf`;
    const dl = await dlPromise;
    if (dl) {
      try { await dl.save({ filename, data: blob }); setPdfStatus(T().pdfSaved); }
      catch (e) { setPdfStatus(e && e.code === "declined" ? "" : (e && e.code === "unavailable" ? T().pdfUnavailable : T().pdfFail)); }
      return;
    }
    if (dl === null) { setPdfStatus(T().pdfUnavailable); return; } // inside a viewer without downloads
    // Standalone file opened in a browser: a normal download link works here
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    setPdfStatus(T().pdfSaved);
  }

  // ---------- rendering ----------
  function renderChrome() {
    document.documentElement.lang = lang;
    document.getElementById("brand").textContent = T().brand;
    document.querySelector(".lang").style.display = ONLY_LANG ? "none" : "";
    document.getElementById("tagline").textContent = T().tagline;
    const prof = document.getElementById("prof");
    prof.style.display = HAS_PROFILES ? "" : "none";
    prof.setAttribute("aria-label", T().profAria);
    document.getElementById("prof-real").textContent = T().profReal;
    document.getElementById("prof-hum").textContent = T().profHum;
    document.getElementById("prof-real").setAttribute("aria-pressed", profile === "real");
    document.getElementById("prof-hum").setAttribute("aria-pressed", profile === "hum");
    document.getElementById("lang-ru").setAttribute("aria-pressed", lang === "ru");
    document.getElementById("lang-ro").setAttribute("aria-pressed", lang === "ro");
    document.getElementById("pick-label").textContent = T().pickLabel;
    const side = document.getElementById("side");
    const pick = document.getElementById("pick");
    let html = `<button class="topic-btn" data-topic="" ${current == null ? 'aria-current="true"' : ""}><span class="n">★</span><span>${T().home}</span><span></span></button>`;
    let opts = `<option value="">${T().home}</option>`;
    [1, 2].forEach((sem) => {
      html += `<div class="sem">${sem === 1 ? T().sem1 : T().sem2}</div>`;
      opts += `<optgroup label="${sem === 1 ? T().sem1 : T().sem2}">`;
      VIS().filter((t) => t.semester === sem).forEach((t) => {
        const b = topicBest(t);
        html += `<button class="topic-btn" data-topic="${t.id}" ${current === t.id ? 'aria-current="true"' : ""}>
          <span class="n">${t.num === 0 ? "∠" : t.num}</span><span>${fmt(L(t.title))}</span>
          <span class="chip ${chipClass(b)}">${b == null ? "—" : b + "%"}</span></button>`;
        opts += `<option value="${t.id}" ${current === t.id ? "selected" : ""}>${t.num === 0 ? "∠" : t.num}. ${L(t.title)}</option>`;
      });
      opts += "</optgroup>";
    });
    side.innerHTML = html;
    pick.innerHTML = opts;
    pick.value = current || "";
  }

  function renderHome() {
    const cards = VIS().map((t) => {
      const lv = [0, 1, 2].map((l) => {
        const b = store.get(`best:${t.id}:${l}`, null);
        return `<span class="chip ${chipClass(b)}">L${l + 1}: ${b == null ? "—" : b + "%"}</span>`;
      }).join("");
      return `<button class="tcard" data-topic="${t.id}"><span class="n">${t.num === 0 ? "∠" : T().topicWord + t.num}</span>
        <b>${fmt(L(t.title))}</b><span class="levels">${lv}</span></button>`;
    }).join("");
    return `<section class="home"><h1>${T().homeTitle}</h1><p>${T().homeText(VIS().length)}</p>${HAS_PROFILES ? `<p class="prof-note">${T().profNote}</p>` : ""}
      <div class="how">${T().how.map(([a, b]) => `<div><b>${a}</b>${b}</div>`).join("")}</div>
      <div class="cards">${cards}</div></section>`;
  }

  function renderSheet(t) {
    return `<div class="sheet"><ul>${L(t.cheat).map((c) => `<li>${fmt(c)}</li>`).join("")}</ul>
      <div class="example">${fmt(L(t.example))}</div>
      <div class="go"><button class="btn" data-tab="0">${T().practice} →</button></div></div>`;
  }

  function renderLevel(t, l, checked) {
    const qs = t.levels[l].map(qAt);
    const base = l + 1;
    let got = 0;
    const rows = [];
    const items = qs.map((q, i) => {
      const st = state[i] || {};
      let cls = "", fb = "";
      if (checked) {
        const ok = checkAnswer(q, st.value);
        const pts = ok ? (st.hint ? base / 2 : base) : 0;
        got += pts;
        const given = q.type === "choice" ? (st.value != null ? L(q.options)[st.value] : "")
          : String(st.value || "").trim().replace(/-/g, "−").replace(/(\d)\.(\d)/g, "$1,$2");
        rows.push({ q, ok, pts, base, hint: !!st.hint, given });
        cls = ok ? "ok" : "bad";
        fb = `<div class="feedback ${cls}"><b>${ok ? T().correct : (st.value == null || st.value === "" ? T().noAnswer : T().wrong)}</b>
          ${ok ? "" : ` ${T().right} <b>${fmt(answerText(q))}</b>.`} ${T().pts(dec(pts), base)}<br>${fmt(L(q.explain))}</div>`;
      }
      let input;
      if (q.type === "choice") {
        input = `<div class="opts">${L(q.options).map((o, k) => `<button type="button" class="opt" data-q="${i}" data-opt="${k}" aria-pressed="${st.value === k}" ${checked ? "disabled" : ""}>${fmt(o)}</button>`).join("")}</div>`;
      } else {
        const ph = q.type === "set" ? T().setPh : T().answer;
        input = `<div class="q-row"><input id="ans-${t.id}-${l}-${i}" data-q="${i}" type="text" inputmode="text" autocomplete="off" placeholder="${ph}" value="${st.value != null ? String(st.value).replace(/"/g, "&quot;") : ""}" ${checked ? "disabled" : ""}>${q.unit ? `<span class="unit">${L(q.unit)}</span>` : ""}</div>`;
      }
      const hint = st.hint ? `<div class="hint"><b>${T().hintShown}:</b> ${fmt(L(q.hint))}</div>`
        : (checked ? "" : `<div><button type="button" class="hint-btn" data-hint="${i}">? ${T().hint}</button></div>`);
      return `<article class="q ${cls}" style="--c:${LEVEL_COLORS[l]}"><div class="q-top"><span class="q-n">${i + 1}</span>
        <div class="q-text">${fmt(L(q.q))}</div><span class="q-pts">${base} ${T().ptsShort}</span></div>
        ${input}${hint}${fb}</article>`;
    }).join("");
    const max = base * qs.length;
    let score = "";
    if (checked) {
      const pct = Math.round((got / max) * 100);
      const g = gradeOf(pct);
      const best = Math.max(pct, store.get(`best:${t.id}:${l}`, 0) || 0);
      store.set(`best:${t.id}:${l}`, best);
      const msg = T().msg.find(([min]) => g >= min)[1];
      lastResult = { t, l, variant, nVar: nVariants(t, l), rows, got, max, pct, grade: g };
      score = `<section class="score" aria-live="polite" style="--c:${LEVEL_COLORS[l]}"><div class="grade">${g}<small>${T().grade}</small></div>
        <div><h3>${T().scoreTitle(dec(got), max)} · ${pct}%</h3><div>${msg}</div><div class="bar"><i style="width:${pct}%"></i></div>
        <div class="unit">${T().best}: ${best}%</div></div></section>
        <section class="report"><label for="student-name">${T().name}</label>
          <input id="student-name" type="text" autocomplete="name" placeholder="${T().namePh}" value="${String(store.get("student", "")).replace(/"/g, "&quot;")}">
          <button class="btn" type="button" data-pdf="1">${T().pdf}</button><span id="pdf-status" class="unit" aria-live="polite"></span></section>`;
    }

      ? `<button class="btn ghost" data-retry="1">${T().retry}</button>${l < 2 ? `<button class="btn" data-tab="${l + 1}">${T().next} →</button>` : ""}`
      : `<button class="btn" data-check="1">${T().check}</button>`;
    const nv = nVariants(t, l);
    const vchip = nv > 1 ? `<span class="chip vchip">${T().variant(variant + 1, nv)}</span> ` : "";
    return `<p class="intro">${vchip}${T().intro(base)}${nv > 1 ? " " + T().newVariant : ""}</p><div class="qs">${items}</div>${score}<div class="actions">${actions}</div>`;
  }

  let checked = false;
  function render() {
    renderChrome();
    const main = document.getElementById("main");
    const t = TOPICS.find((x) => x.id === current);
    if (!t) { main.innerHTML = renderHome(); return; }
    const tabs = [["sheet", T().sheet, "var(--accent)"], [0, T().level[0], LEVEL_COLORS[0]], [1, T().level[1], LEVEL_COLORS[1]], [2, T().level[2], LEVEL_COLORS[2]]]
      .map(([k, name, c]) => {
        const b = k === "sheet" ? null : store.get(`best:${t.id}:${k}`, null);
        return `<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab === k}" style="--c:${c}"><span class="dot"></span>${name}${b != null ? ` <span class="chip ${chipClass(b)}">${b}%</span>` : ""}</button>`;
      }).join("");
    const body = tab === "sheet" ? renderSheet(t) : renderLevel(t, tab, checked);
    main.innerHTML = `<div class="topic-head"><span class="num">${t.num === 0 ? "∠" : T().topicWord + t.num}</span><h1>${fmt(L(t.title))}</h1></div>
      <div class="tabs" role="tablist">${tabs}</div>${body}`;
  }

  function openTopic(id) { current = id || null; tab = "sheet"; state = {}; checked = false; store.set("topic", current); render(); window.scrollTo(0, 0); }
  function openTab(k) {
    tab = k === "sheet" ? "sheet" : +k; state = {}; checked = false; lastResult = null;
    const t = TOPICS.find((x) => x.id === current);
    variant = (t && tab !== "sheet") ? pickVariant(t, tab) : 0;
    render(); window.scrollTo(0, 0);
  }

  document.addEventListener("click", (e) => {
    const el = e.target.closest("button");
    if (!el) return;
    if (el.id === "prof-real" || el.id === "prof-hum") {
      profile = el.id === "prof-real" ? "real" : "hum"; store.set("profile", profile);
      if (current && !VIS().find((x) => x.id === current)) { current = null; store.set("topic", null); }
      render(); return;
    }
    if (el.id === "lang-ru" || el.id === "lang-ro") { lang = el.id.slice(5); store.set("lang", lang); render(); return; }
    if (el.dataset.topic !== undefined) { openTopic(el.dataset.topic); return; }
    if (el.dataset.tab !== undefined) { openTab(el.dataset.tab); return; }
    if (el.dataset.opt !== undefined) { const i = +el.dataset.q; state[i] = { ...(state[i] || {}), value: +el.dataset.opt }; render(); return; }
    if (el.dataset.hint !== undefined) { const i = +el.dataset.hint; state[i] = { ...(state[i] || {}), hint: true }; render(); return; }
    if (el.dataset.check) {
      checked = true;
      const t = TOPICS.find((x) => x.id === current);
      store.set(`attempt:${t.id}:${tab}`, store.get(`attempt:${t.id}:${tab}`, 0) + 1);
      render(); document.querySelector(".score")?.scrollIntoView({ block: "center" }); return;
    }
    if (el.dataset.pdf) { savePdf(); return; }
    if (el.dataset.retry) { openTab(tab); }
  });
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.matches("input[data-q]")) { const i = +el.dataset.q; state[i] = { ...(state[i] || {}), value: el.value }; }
    if (el.id === "student-name") store.set("student", el.value);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches("input[data-q]")) {
      const inputs = [...document.querySelectorAll("input[data-q]")];
      const next = inputs[inputs.indexOf(e.target) + 1];
      if (next) next.focus(); else document.querySelector("[data-check]")?.focus();
    }
  });
  document.getElementById("pick").addEventListener("change", (e) => openTopic(e.target.value));
  if (current && !VIS().find((t) => t.id === current)) current = null;
  render();
})();
</script>

</body>
</html>
